<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラ追加 — hico1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Noto+Sans+JP:wght@300;400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #070508;
  --surface:   #0E0B12;
  --surface2:  #160F1C;
  --rose:      #C83060;
  --rose-dim:  rgba(200,48,96,.1);
  --rose-glow: rgba(200,48,96,.32);
  --cream:     #EDE0D4;
  --muted:     #7A6878;
  --border:    rgba(139,21,56,.28);
  --border-hi: rgba(200,48,96,.38);
  --success:   #3DD68C;
  --suc-dim:   rgba(61,214,140,.12);
  --error:     #F97066;
  --err-dim:   rgba(249,112,102,.12);
}
html { color-scheme: dark; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  background: var(--bg);
  color: var(--cream);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 16px 48px;
}

/* back link */
.back {
  position: fixed; top: 0; left: 0; right: 0;
  height: 56px;
  display: flex; align-items: center; padding: 0 32px;
  background: rgba(7,5,8,.85); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  justify-content: space-between;
}
.back-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--cream); text-decoration: none; letter-spacing: .04em; }
.back-link { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color .15s; }
.back-link:hover { color: var(--cream); }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* card */
.card {
  width: 100%; max-width: 500px;
  display: flex; flex-direction: column; gap: 28px;
}
.card-header { display: flex; flex-direction: column; gap: 10px; }
.card-eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--rose); }
.card-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; line-height: 1.1; letter-spacing: .02em; }
.card-title em { font-style: italic; color: var(--rose); }
.card-sub { font-size: 13px; color: var(--muted); line-height: 1.7; }

.divider { height: 1px; background: var(--border); }

/* drop zone */
input[type="file"] { display: none; }
.drop-zone {
  border: 1.5px dashed var(--border-hi);
  border-radius: 12px; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  cursor: pointer; transition: border-color .2s, background .2s;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--rose); background: var(--rose-dim);
}
.drop-zone:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.drop-icon {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(200,48,96,.08); border: 1.5px solid rgba(200,48,96,.28);
  display: flex; align-items: center; justify-content: center;
  transition: transform .24s, box-shadow .24s;
}
.drop-zone:hover .drop-icon, .drop-zone.dragover .drop-icon {
  transform: translateY(-3px); box-shadow: 0 8px 20px var(--rose-glow);
}
.drop-icon svg { width: 20px; height: 20px; stroke: var(--rose); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.drop-label { font-size: 14px; color: var(--cream); font-weight: 400; text-align: center; }
.drop-label em { font-style: normal; color: var(--rose); }
.drop-hint { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* preview */
.preview-wrap { display: none; gap: 14px; align-items: flex-start; background: var(--surface2); border: 1px solid var(--border-hi); border-radius: 10px; padding: 14px; }
.preview-wrap.visible { display: flex; }
.preview-img { width: 68px; height: 68px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
.preview-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.preview-name { font-size: 13px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview-size { font-size: 12px; color: var(--muted); }
.preview-clear { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 17px; line-height: 1; transition: color .15s; flex-shrink: 0; align-self: flex-start; }
.preview-clear:hover { color: var(--error); }

/* status */
.status { display: none; border-radius: 10px; padding: 12px 14px; font-size: 13px; font-weight: 400; gap: 10px; align-items: flex-start; }
.status.visible { display: flex; }
.status.ok  { background: var(--suc-dim); color: var(--success); border: 1px solid rgba(61,214,140,.25); }
.status.err { background: var(--err-dim); color: var(--error);   border: 1px solid rgba(249,112,102,.25); }
.status-icon { flex-shrink: 0; font-size: 15px; line-height: 1.5; }

/* button */
.btn-upload {
  width: 100%; padding: 13px; background: var(--rose); color: #fff; border: none;
  border-radius: 10px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500;
  font-size: 13px; cursor: pointer; letter-spacing: .07em;
  transition: opacity .15s, transform .1s, box-shadow .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-upload:not(:disabled):hover { opacity: .88; box-shadow: 0 0 22px var(--rose-glow); }
.btn-upload:not(:disabled):active { transform: translateY(1px); }
.btn-upload:disabled { opacity: .28; cursor: not-allowed; }
.btn-upload.loading svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* rules */
.rules { display: flex; flex-direction: column; gap: 7px; }
.rules-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.rules-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.rules-list li { font-size: 12px; color: var(--muted); display: flex; align-items: baseline; gap: 8px; line-height: 1.6; }
.rules-list li::before { content: '—'; color: rgba(139,21,56,.55); font-size: 10px; flex-shrink: 0; }

@media (prefers-reduced-motion: reduce) {
  .drop-zone, .drop-icon, .btn-upload { transition: none; }
  .btn-upload.loading svg { animation: none; }
}
</style>
</head>
<body>

<nav class="back">
  <a href="./index.html" class="back-logo">hico1</a>
  <a href="./index.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Gallery
  </a>
</nav>

<div class="card">
  <div class="card-header">
    <p class="card-eyebrow">Fan Art Upload</p>
    <h1 class="card-title">キャラ画像を<br><em>追加しよう</em></h1>
    <p class="card-sub">アップロードした画像は配信者が確認後、配信画面のゲームに自動で反映されます。</p>
  </div>

  <div class="divider"></div>

  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif">

  <label class="drop-zone" id="dropZone" for="fileInput" tabindex="0" role="button" aria-label="画像ファイルを選択またはドロップ">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <p class="drop-label">ドラッグ＆ドロップ または <em>クリックして選択</em></p>
    <p class="drop-hint">PNG · JPG · WebP · GIF &nbsp;／&nbsp; 最大 2 MB</p>
  </label>

  <div class="preview-wrap" id="previewWrap">
    <img class="preview-img" id="previewImg" src="" alt="プレビュー">
    <div class="preview-info">
      <p class="preview-name" id="previewName"></p>
      <p class="preview-size" id="previewSize"></p>
    </div>
    <button class="preview-clear" id="previewClear" aria-label="選択を解除">×</button>
  </div>

  <div class="status" id="status" role="alert" aria-live="polite">
    <span class="status-icon" id="statusIcon"></span>
    <span class="status-text"  id="statusText"></span>
  </div>

  <button class="btn-upload" id="btnUpload" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    アップロード
  </button>

  <div class="rules">
    <p class="rules-label">注意事項</p>
    <ul class="rules-list">
      <li>他の人や実在のキャラの画像は使わないでください</li>
      <li>PNG / JPG / WebP / GIF のみ対応です</li>
      <li>2 MB を超えるファイルはアップロードできません</li>
      <li>内容によっては配信者の判断で削除されます</li>
    </ul>
  </div>
</div>

<script>
const WORKER_URL = 'https://kukucome-chara-worker.chikamakoo.workers.dev';
console.log('[hico1 upload] version: 2026-09-02-v8');

const dropZone    = document.getElementById('dropZone');
const fileInput   = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg  = document.getElementById('previewImg');
const previewName = document.getElementById('previewName');
const previewSize = document.getElementById('previewSize');
const previewClear= document.getElementById('previewClear');
const btnUpload   = document.getElementById('btnUpload');
const status      = document.getElementById('status');
const statusIcon  = document.getElementById('statusIcon');
const statusText  = document.getElementById('statusText');

let selectedFile = null;

const showStatus = (type, icon, text) => {
  status.className = 'status visible ' + type;
  statusIcon.textContent = icon;
  statusText.textContent = text;
};
const hideStatus = () => { status.className = 'status'; };
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(2) + ' MB';

function setFile(file) {
  if (!file) return;
  if (!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)) {
    showStatus('err','❌','対応していない形式です。PNG / JPG / WebP / GIF を選んでください。'); return;
  }
  if (file.size > 2*1024*1024) {
    showStatus('err','❌',`ファイルが大きすぎます（${fmtSize(file.size)}）。2MB以下にしてください。`); return;
  }
  selectedFile = file; hideStatus();
  const r = new FileReader();
  r.onload = e => { previewImg.src = e.target.result; };
  r.readAsDataURL(file);
  previewName.textContent = file.name;
  previewSize.textContent = fmtSize(file.size);
  previewWrap.classList.add('visible');
  btnUpload.disabled = false;
}
function clearFile() {
  selectedFile = null; fileInput.value = '';
  previewWrap.classList.remove('visible'); previewImg.src = '';
  btnUpload.disabled = true; hideStatus();
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files && fileInput.files[0];
  if (file) { clearFile(); setFile(file); }
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); clearFile(); setFile(e.dataTransfer.files[0]); });
dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
previewClear.addEventListener('click', clearFile);

const uploadSVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`;
const spinSVG   = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;

// PNG/JPG → WebP 変換（GIF・WebP はそのまま）
function toWebP(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'image/gif' || file.type === 'image/webp') { resolve(file); return; }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(b => b ? resolve(b) : reject(new Error('WebP変換失敗')), 'image/webp', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像読み込み失敗')); };
    img.src = url;
  });
}

btnUpload.addEventListener('click', async () => {
  if (!selectedFile) return;
  btnUpload.disabled = true; btnUpload.classList.add('loading');
  btnUpload.innerHTML = spinSVG + ' アップロード中…'; hideStatus();
  try {
    const blob = await toWebP(selectedFile);
    const form = new FormData(); form.append('file', blob, 'image.webp');
    const res  = await fetch(WORKER_URL + '/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'アップロードに失敗しました');
    showStatus('ok', '✅', 'アップロード完了！配信画面に自動で追加されます。ありがとうございます！');
    clearFile();
  } catch (err) {
    showStatus('err', '❌', err.message || 'ネットワークエラーが発生しました。もう一度お試しください。');
    btnUpload.disabled = false;
  } finally {
    btnUpload.classList.remove('loading');
    btnUpload.innerHTML = uploadSVG + ' アップロード';
  }
});
</script>
</body>
</html>
