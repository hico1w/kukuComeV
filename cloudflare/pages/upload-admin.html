<title>Upload Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Noto+Sans+JP:wght@300;400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #070508;
  --surface:  #0E0B12;
  --surface2: #160F1C;
  --rose:     #C83060;
  --rose-dim: rgba(200,48,96,.1);
  --cream:    #EDE0D4;
  --muted:    #7A6878;
  --border:   rgba(139,21,56,.28);
  --border-hi:rgba(200,48,96,.38);
  --success:  #3DD68C;
  --error:    #F97066;
  --warn:     #FBB647;
}
html { color-scheme: dark; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  background: var(--bg);
  color: var(--cream);
  min-height: 100dvh;
}

/* ── nav ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  background: rgba(7,5,8,.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
.nav-tag { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--rose); }

/* ── auth ── */
#auth-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100dvh - 56px); gap: 20px; padding: 40px 16px;
}
.auth-card {
  width: 100%; max-width: 360px;
  background: var(--surface); border: 1px solid var(--border-hi);
  border-radius: 12px; padding: 32px 28px; display: flex; flex-direction: column; gap: 20px;
}
.auth-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }
.auth-title em { font-style: italic; color: var(--rose); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.field input {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--cream);
  font-family: monospace; outline: none; transition: border-color .15s;
}
.field input:focus { border-color: var(--rose); }

/* ── buttons ── */
.btn {
  border: none; border-radius: 6px; padding: 9px 16px;
  font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 12px;
  letter-spacing: .06em; cursor: pointer; transition: opacity .15s, transform .1s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn-primary { background: var(--rose); color: #fff; }
.btn-primary:not(:disabled):hover { opacity: .85; }
.btn-block { background: rgba(249,112,102,.15); color: var(--error); border: 1px solid rgba(249,112,102,.3); }
.btn-block:not(:disabled):hover { background: rgba(249,112,102,.25); }
.btn-unblock { background: rgba(61,214,140,.1); color: var(--success); border: 1px solid rgba(61,214,140,.25); }
.btn-unblock:not(:disabled):hover { background: rgba(61,214,140,.2); }
.btn-sm { padding: 5px 12px; font-size: 11px; }

/* ── main ── */
#main-screen { display: none; padding: 32px; }
.main-grid {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

/* ── panels ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.panel-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.panel-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; }
.panel-count { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.panel-body { padding: 0; }

/* ── IP groups ── */
.ip-group {
  border-bottom: 1px solid var(--border);
}
.ip-group:last-child { border-bottom: none; }
.ip-group.blocked .ip-group-head { opacity: .55; }

.ip-group-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 18px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.ip-group-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ip-mono { font-family: monospace; font-size: 13px; color: var(--cream); white-space: nowrap; }
.ip-count { font-size: 11px; color: var(--rose); letter-spacing: .08em; white-space: nowrap; }
.ip-ts { font-size: 11px; color: var(--muted); white-space: nowrap; }
.badge-blocked { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(249,112,102,.15); color: var(--error); letter-spacing: .08em; white-space: nowrap; }

/* ── image grid ── */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 1px;
  background: var(--border);
}
.img-card {
  background: var(--surface);
  cursor: pointer;
  transition: background .15s;
  overflow: hidden;
}
.img-card:hover { background: var(--surface2); }
.img-thumb-wrap {
  aspect-ratio: 1;
  background: #0a0810;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.img-thumb {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: opacity .15s;
}
.img-card:hover .img-thumb { opacity: .85; }
.img-thumb-wrap .img-err-icon { display: none; font-size: 20px; color: var(--muted); }
.img-thumb-wrap.err .img-thumb { display: none; }
.img-thumb-wrap.err .img-err-icon { display: block; }
.img-info {
  padding: 5px 7px 6px;
  border-top: 1px solid var(--border);
}
.img-name {
  font-family: monospace; font-size: 9px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.img-ts { font-size: 9px; color: var(--muted); margin-top: 1px; }

/* ── loading / empty ── */
.loading-box { padding: 40px; text-align: center; }
.empty-box { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

/* ── blocklist ── */
.block-list { display: flex; flex-direction: column; }
.block-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; gap: 12px;
  border-bottom: 1px solid rgba(139,21,56,.12);
}
.block-item:last-child { border-bottom: none; }
.block-ip { font-family: monospace; font-size: 13px; }
.empty-block { padding: 24px 18px; color: var(--muted); font-size: 13px; text-align: center; }

/* ── status bar ── */
.status-bar {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border-hi);
  border-radius: 8px; padding: 10px 20px; font-size: 13px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .25s;
  z-index: 100; white-space: nowrap;
}
.status-bar.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.status-bar.ok  { color: var(--success); border-color: rgba(61,214,140,.3); }
.status-bar.err { color: var(--error);   border-color: rgba(249,112,102,.3); }

/* ── spinner ── */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(237,224,212,.2); border-top-color: var(--cream); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── lightbox ── */
#_lb {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 999;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  cursor: zoom-out;
}
#_lb img {
  max-width: 92vw; max-height: 86vh;
  object-fit: contain; border-radius: 4px;
  box-shadow: 0 8px 48px rgba(0,0,0,.7);
}
#_lb_label { font-family: monospace; font-size: 11px; color: #6b7280; }
</style>

<nav class="nav">
  <span class="nav-logo">hico1</span>
  <span class="nav-tag">Upload Admin</span>
</nav>

<!-- auth screen -->
<div id="auth-screen">
  <div class="auth-card">
    <p class="auth-title">Upload <em>Admin</em></p>
    <div class="field">
      <label>Admin Secret</label>
      <input type="password" id="secret-input" placeholder="ADMIN_SECRET を入力" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="auth-btn">ログイン</button>
    <p id="auth-err" style="font-size:12px;color:var(--error);display:none;"></p>
  </div>
</div>

<!-- main screen -->
<div id="main-screen">
  <div class="main-grid">
    <!-- upload log -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Upload Log</span>
        <span class="panel-count" id="log-count">—</span>
      </div>
      <div class="panel-body">
        <div id="log-groups">
          <div class="loading-box"><span class="spinner"></span></div>
        </div>
      </div>
    </div>

    <!-- blocklist -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Blocklist</span>
        <span class="panel-count" id="block-count">—</span>
      </div>
      <div class="panel-body">
        <div class="block-list" id="block-list">
          <div class="empty-block"><span class="spinner"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- lightbox -->
<div id="_lb">
  <img id="_lb_img" src="" alt="">
  <div id="_lb_label"></div>
</div>

<div class="status-bar" id="status-bar"></div>

<script>
const WORKER = 'https://kukucome-chara-worker.chikamakoo.workers.dev';
const GH_RAW = 'https://raw.githubusercontent.com/hico1w/kukucome-chara-uploads/main/';
let SECRET = '';
let blockedIPs = new Set();

// ── auth ──────────────────────────────────────────────────────────
const secretInput = document.getElementById('secret-input');
const authErr = document.getElementById('auth-err');

async function tryLogin() {
  const s = secretInput.value.trim();
  if (!s) return;
  document.getElementById('auth-btn').disabled = true;
  authErr.style.display = 'none';
  try {
    const res = await fetch(`${WORKER}/admin/logs?secret=${encodeURIComponent(s)}`);
    if (res.status === 401) throw new Error('パスワードが違います');
    SECRET = s;
    try { localStorage.setItem('_admin_secret', s); } catch {}
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    loadAll();
  } catch (e) {
    authErr.textContent = e.message;
    authErr.style.display = 'block';
  }
  document.getElementById('auth-btn').disabled = false;
}

document.getElementById('auth-btn').addEventListener('click', tryLogin);
secretInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

try {
  const saved = localStorage.getItem('_admin_secret');
  if (saved) secretInput.value = saved;
} catch {}

// ── load ──────────────────────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadBlocklist(), loadLogs()]);
}

async function loadBlocklist() {
  const res = await fetch(`${WORKER}/admin/blocklist?secret=${encodeURIComponent(SECRET)}`);
  const data = await res.json();
  blockedIPs = new Set(data.blocked || []);
  renderBlocklist(data.blocked || []);
}

async function loadLogs() {
  const res = await fetch(`${WORKER}/admin/logs?secret=${encodeURIComponent(SECRET)}`);
  const data = await res.json();
  renderLogs(data.entries || []);
}

// ── render logs (IP grouped) ──────────────────────────────────────
function renderLogs(entries) {
  const container = document.getElementById('log-groups');
  document.getElementById('log-count').textContent = entries.length + ' 件';

  if (!entries.length) {
    container.innerHTML = '<div class="empty-box">アップロード記録がありません</div>';
    return;
  }

  // group by IP
  const groups = {};
  entries.forEach(e => {
    if (!groups[e.ip]) groups[e.ip] = [];
    groups[e.ip].push(e);
  });

  // sort IPs by latest upload desc
  const sortedIPs = Object.keys(groups).sort((a, b) => {
    const la = Math.max(...groups[a].map(e => new Date(e.timestamp).getTime()));
    const lb = Math.max(...groups[b].map(e => new Date(e.timestamp).getTime()));
    return lb - la;
  });

  container.innerHTML = '';
  sortedIPs.forEach(ip => {
    const group = groups[ip].slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const isBlocked = blockedIPs.has(ip);
    const latestTs = new Date(group[0].timestamp).toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });

    const div = document.createElement('div');
    div.className = 'ip-group' + (isBlocked ? ' blocked' : '');
    div.dataset.ip = ip;

    // group header
    const head = document.createElement('div');
    head.className = 'ip-group-head';
    head.innerHTML = `
      <div class="ip-group-info">
        <span class="ip-mono">${escHtml(ip)}</span>
        ${isBlocked ? '<span class="badge-blocked">blocked</span>' : ''}
        <span class="ip-count">${group.length} 件</span>
        <span class="ip-ts">${latestTs}</span>
      </div>
      <button class="btn ${isBlocked ? 'btn-unblock' : 'btn-block'} btn-sm"
        onclick="${isBlocked ? `unblockIP('${escHtml(ip)}')` : `blockIP('${escHtml(ip)}')`}">
        ${isBlocked ? '解除' : 'ブロック'}
      </button>
    `;

    // image grid
    const grid = document.createElement('div');
    grid.className = 'img-grid';

    group.forEach(e => {
      const imgUrl = GH_RAW + encodeURIComponent(e.file);
      const ts2 = new Date(e.timestamp).toLocaleString('ja-JP', {
        timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });

      const card = document.createElement('div');
      card.className = 'img-card';
      card.addEventListener('click', () => openLightbox(imgUrl, e.file));

      const wrap = document.createElement('div');
      wrap.className = 'img-thumb-wrap';

      const img = document.createElement('img');
      img.className = 'img-thumb';
      img.src = imgUrl;
      img.loading = 'lazy';
      img.alt = e.file;
      img.onerror = () => wrap.classList.add('err');

      const errIcon = document.createElement('span');
      errIcon.className = 'img-err-icon';
      errIcon.textContent = '📷';

      wrap.appendChild(img);
      wrap.appendChild(errIcon);

      const info = document.createElement('div');
      info.className = 'img-info';
      info.innerHTML = `<div class="img-name" title="${escHtml(e.file)}">${escHtml(e.file)}</div><div class="img-ts">${ts2}</div>`;

      card.appendChild(wrap);
      card.appendChild(info);
      grid.appendChild(card);
    });

    div.appendChild(head);
    div.appendChild(grid);
    container.appendChild(div);
  });
}

// ── render blocklist ──────────────────────────────────────────────
function renderBlocklist(list) {
  const el = document.getElementById('block-list');
  document.getElementById('block-count').textContent = list.length + ' 件';

  if (!list.length) {
    el.innerHTML = '<div class="empty-block">ブロック中の IP はありません</div>';
    return;
  }

  el.innerHTML = list.map(ip => `
    <div class="block-item" id="bi-${CSS.escape(ip)}">
      <span class="block-ip">${escHtml(ip)}</span>
      <button class="btn btn-unblock btn-sm" onclick="unblockIP('${escHtml(ip)}')">解除</button>
    </div>
  `).join('');
}

// ── lightbox ──────────────────────────────────────────────────────
const lb = document.getElementById('_lb');
const lbImg = document.getElementById('_lb_img');
const lbLabel = document.getElementById('_lb_label');

function openLightbox(url, label) {
  lbImg.src = url;
  lbLabel.textContent = label;
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

lb.addEventListener('click', () => {
  lb.style.display = 'none';
  document.body.style.overflow = '';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lb.style.display === 'flex') {
    lb.style.display = 'none';
    document.body.style.overflow = '';
  }
});

// ── actions ───────────────────────────────────────────────────────
async function blockIP(ip) {
  disableIPBtns(ip);
  try {
    const res = await fetch(`${WORKER}/admin/block?secret=${encodeURIComponent(SECRET)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip }),
    });
    if (!res.ok) throw new Error(await res.text());
    showStatus('ok', `${ip} をブロックしました`);
    await loadAll();
  } catch (e) {
    showStatus('err', 'エラー: ' + e.message);
    enableIPBtns(ip);
  }
}

async function unblockIP(ip) {
  disableIPBtns(ip);
  try {
    const res = await fetch(`${WORKER}/admin/block?secret=${encodeURIComponent(SECRET)}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip }),
    });
    if (!res.ok) throw new Error(await res.text());
    showStatus('ok', `${ip} のブロックを解除しました`);
    await loadAll();
  } catch (e) {
    showStatus('err', 'エラー: ' + e.message);
    enableIPBtns(ip);
  }
}

function disableIPBtns(ip) {
  document.querySelectorAll(`[data-ip="${CSS.escape(ip)}"] button, #bi-${CSS.escape(ip)} button`)
    .forEach(b => b.disabled = true);
}
function enableIPBtns(ip) {
  document.querySelectorAll(`[data-ip="${CSS.escape(ip)}"] button, #bi-${CSS.escape(ip)} button`)
    .forEach(b => b.disabled = false);
}

// ── status toast ──────────────────────────────────────────────────
let _toastTimer;
function showStatus(type, msg) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'status-bar'; }, 3000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
