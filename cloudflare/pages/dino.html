<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:wght@300;600&family=Noto+Sans+JP:wght@300;400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  background: #0b0d12;
  color: #ede0d4;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ── header ── */
#bar {
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 24px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.bar-home { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; letter-spacing: .05em; }
.bar-back { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(237,224,212,.5); transition: color .15s; }
.bar-back:hover { color: #ede0d4; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.bar-btn {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(237,224,212,.55);
  border: 1px solid rgba(255,255,255,.16); border-radius: 4px;
  padding: 4px 9px; transition: color .15s, border-color .15s, opacity .15s;
}
.bar-btn:hover { color: #ede0d4; border-color: rgba(255,255,255,.4); }
.bar-hint { font-size: 10px; letter-spacing: .12em; color: rgba(237,224,212,.4); }

/* ── stage ── */
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
#wrap {
  position: relative;
  width: 100%;
  max-width: 1200px;
  /* 縦横比は画面幅で変える。スマホで 3:1 のままだと盤面が小さすぎて遊べない */
  aspect-ratio: 3 / 1;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.5);
  touch-action: manipulation;
}
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

/* ── overlays ── */
.ov {
  position: absolute; inset: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 3.2%;
  background: rgba(10,12,18,.55);
  text-align: center;
  padding: 3%;
  overflow-y: auto;
}
.ov.show { display: flex; }
.pix {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  color: #fff; line-height: 1.6;
  text-shadow: 3px 3px 0 #1b2a4a, -1px -1px 0 #1b2a4a, 1px -1px 0 #1b2a4a, -1px 1px 0 #1b2a4a;
}
#over-title { font-size: clamp(15px, 3.4vw, 36px); letter-spacing: .06em; }
.ov-score { font-size: clamp(8px, 1.5vw, 14px); color: #ffe9a8; }
#start-title { font-size: clamp(13px, 3vw, 30px); }
.ov-sub { font-size: clamp(9px, 1.4vw, 13px); letter-spacing: .1em; color: rgba(255,255,255,.82); }

#retry { width: clamp(120px, 17%, 190px); filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); transition: transform .12s ease; padding: 0; display: block; }
#retry:hover { transform: translateY(-2px) scale(1.03); }
#retry:active { transform: translateY(1px) scale(.99); }
#retry img { width: 100%; display: block; }

/* ── ランキング登録 ── */
#reg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
#reg.hide { display: none; }
#name {
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 400;
  width: clamp(140px, 24vw, 210px);
  padding: 7px 10px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.94); color: #111;
}
#name:focus { outline: 2px solid #ffd34d; outline-offset: 1px; }
#send {
  font-size: 12px; font-weight: 500; letter-spacing: .08em;
  background: #ffd34d; color: #3a2a00;
  padding: 8px 16px; border-radius: 5px; transition: opacity .15s;
}
#send:hover:not(:disabled) { opacity: .88; }
#send:disabled { opacity: .45; cursor: not-allowed; }
#reg-msg { font-size: 11px; color: #ffe9a8; min-height: 1.2em; }

/* ── ランキング表 ── */
.rank-box { width: min(460px, 94%); }
.rank-head { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 6px; }
.rank-list { list-style: none; font-size: 12px; }
.rank-list li {
  display: grid; grid-template-columns: 2.4em 1fr auto 5.6em;
  gap: 8px; align-items: baseline;
  padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,.1);
}
.rank-list li.me { background: rgba(255,211,77,.18); border-radius: 3px; }
.rank-no { font-family: 'Press Start 2P', monospace; font-size: 9px; color: rgba(255,255,255,.55); }
.rank-list li:nth-child(1) .rank-no { color: #ffd34d; }
.rank-list li:nth-child(2) .rank-no { color: #d8d8d8; }
.rank-list li:nth-child(3) .rank-no { color: #e0a878; }
.rank-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.rank-score { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff; }
.rank-date { font-size: 10px; color: rgba(255,255,255,.42); text-align: right; }
.rank-empty { font-size: 11px; color: rgba(255,255,255,.5); padding: 10px 0; }

#rank-close {
  font-size: 11px; letter-spacing: .12em; color: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 5px 12px;
}

/* ── 歌詞の背景（スコア5000超で出す） ──
   ゲーム画面の裏には文字を置かない。盤面の上下左右の余白に
   4つの領域を作って、そこだけに敷き詰める。 */
#lyrics {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 2.2s ease;
  overflow: hidden;
}
#lyrics.on { opacity: 1; }
.ly-zone {
  position: absolute;
  overflow: hidden;
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  gap: .28em .7em;
  padding: 6px 10px;
  line-height: 1.35;
  color: #1b2130;                 /* 背景(#0b0d12)より少し明るいだけ */
  font-weight: 400;
  user-select: none;
}
.ly-zone span { white-space: nowrap; }
.ly-s  { font-size: clamp(10px, 1.1vw, 15px); }
.ly-m  { font-size: clamp(13px, 1.7vw, 24px); color: #202737; }
.ly-l  { font-size: clamp(18px, 2.9vw, 44px); color: #262f43; font-weight: 500; letter-spacing: .04em; }
.ly-xl {
  font-size: clamp(26px, 5.2vw, 82px);
  color: #2c374e;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  letter-spacing: .06em;
}
#stage { position: relative; z-index: 1; }
#bar   { position: relative; z-index: 2; }

/* ── ロード画面（tatie を回す） ── */
#loading {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: #7fd4f5;
  transition: opacity .45s ease;
}
#loading.hide { opacity: 0; pointer-events: none; }
#loading img {
  height: min(52%, 190px); width: auto;
  animation: spin 1.5s linear infinite;
  filter: drop-shadow(0 6px 12px rgba(0,60,90,.3));
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: .1em; color: #17384d; }

@media (max-width: 900px) { #wrap { aspect-ratio: 2 / 1; } }
@media (max-width: 640px) {
  #bar { padding: 0 12px; gap: 10px; height: 46px; }
  .bar-hint { display: none; }
  #stage { padding: 8px; }
  #wrap { aspect-ratio: 1.45 / 1; }
  .rank-list li { grid-template-columns: 2.2em 1fr auto; }
  .rank-date { display: none; }
}
@media (prefers-reduced-motion: reduce) { #loading img { animation: none; } }
</style>

<script>
(function () {
'use strict';

const WORKER = 'https://kukucome-chara-worker.chikamakoo.workers.dev';

// ── 論理サイズ。背景 back(2172x724) を高さ400に合わせると幅ちょうど1200
const TILE = 1200;      // 背景1枚ぶんの幅（絵の縦横比から決まる固定値）
let   W = 1200;         // 実際に映す幅。表示領域の縦横比に合わせる
const H = 400;
// 背景の空と地面の境目。原寸 y=551/724 を実測して求めた
const GROUND = Math.round(H * 0.7611) + 4;

const DIR = './img-dino/';
const RUN_SEQ  = ['run_01', 'run_04', 'run_02'];   // 走りはこの3枚をこの順で
const JUMP_SEQ = ['jump_01','jump_02','jump_03','jump_04','jump_05','jump_06'];
const DEAD_SEQ = ['dead1','dead2','dead3','dead4'];
const NAMES = [
  'back', 'sun', 'cloud1', 'cloud2', 'cloud3', 'cloud4', 'cloud5',
  'hugu', 'hosi', 'kani', 'kaniyarare',
].concat(RUN_SEQ, JUMP_SEQ, DEAD_SEQ);

const cv   = document.getElementById('game');
const wrap = document.getElementById('wrap');
const ctx  = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const startOv = document.getElementById('start-ov');
const overOv  = document.getElementById('over-ov');
const overSc  = document.getElementById('over-score');
const rankOv  = document.getElementById('rank-ov');
const loading = document.getElementById('loading');
const retryBtn= document.getElementById('retry');
const nameEl  = document.getElementById('name');
const sendEl  = document.getElementById('send');
const regEl   = document.getElementById('reg');
const regMsg  = document.getElementById('reg-msg');

const img = {};
let jumpSfx = null, bgm = null, bgmOn = true;

/* 表示領域の縦横比に合わせて論理幅を決める。
   横が狭いほど見える範囲も狭くなるので、そのぶん移動速度も落として
   「障害物が見えてから反応できる時間」をどの画面でも揃える（SPD）。 */
function fit() {
  const r = wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  W = Math.max(420, Math.round(H * (r.width / r.height)));
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;
}
const SPD = () => W / TILE;
addEventListener('resize', fit);

// ── 調整用の数値 ────────────────────────────────────────
const CFG = {
  charScale: 0.50,        // 原寸220px → 約110px
  speed0: 420,
  speedMax: 1100,
  speedRate: 1.005,       // 1秒あたり +0.5%
  gravity: 1200,          // 頂点150px / 滞空1.0秒 になる組み合わせ
  jumpV: 600,
  dropV: 2600,            // 空中でもう一度押したときの落下速度（頂点150pxから約3フレームで着地）
  runFps: 10,
  jumpFps: 11,
  deadFps: 9,
};
const AIRTIME = 2 * CFG.jumpV / CFG.gravity;               // 1.0秒
const APEX    = CFG.jumpV * CFG.jumpV / (2 * CFG.gravity); // 150px

const state = {
  mode: 'ready',          // ready | playing | dying | over
  last: 0,
  speed: CFG.speed0,
  dist: 0, score: 0,
  best: +(localStorage.getItem('dino-best') || 0) || 0,
  bgScroll: 0, sunX: 0,
  y: 0, vy: 0, onGround: true,
  frame: 0, frameT: 0,
  obstacles: [], clouds: [], flying: [],
  gameT: 0,               // プレイ中の経過時間(秒)。速度上昇の検算用
  reach: null,            // 直前の障害物を抜けた時点で取りうる状態（詰み防止）
  nextKind: null,         // 次に出す種類（間隔を先に決めるため）
  curGap: 520,            // 直前から今回までの距離
  sinceSpawn: 0,          // 前の障害物からの距離(px)。時間ではなく距離で管理する
  nextGap: 520,
  lastKind: null,
  deadT: 0,
};

/* ── 読み込み ─────────────────────────────────────────── */
function load() {
  let left = NAMES.length;
  return new Promise(resolve => {
    NAMES.forEach(n => {
      const im = new Image();
      im.onload = im.onerror = () => { if (--left === 0) resolve(); };
      im.src = DIR + n + '.webp';
      img[n] = im;
    });
    try {
      jumpSfx = new Audio(DIR + 'jump.mp3');
      jumpSfx.preload = 'auto';
      jumpSfx.volume = 0.45;
      // BGM は 4.8MB あるので、読み込み完了は待たずに裏で用意する
      bgm = new Audio(DIR + 'madakana.mp3');
      bgm.loop = true;
      bgm.volume = 0.32;
      bgm.preload = 'auto';
    } catch (e) { jumpSfx = null; bgm = null; }
  });
}

function playJump() {
  if (!jumpSfx) return;
  try { jumpSfx.currentTime = 0; jumpSfx.play().catch(() => {}); } catch (e) {}
}
// 自動再生はブラウザに止められるので、最初の操作をきっかけに鳴らし始める
function startBgm() {
  if (bgm && bgmOn && bgm.paused) bgm.play().catch(() => {});
}
document.getElementById('btn-bgm').addEventListener('click', function () {
  bgmOn = !bgmOn;
  this.setAttribute('aria-pressed', String(!bgmOn));
  this.textContent = bgmOn ? '♪ BGM' : '♪ BGM OFF';
  this.style.opacity = bgmOn ? '' : '.5';
  if (!bgm) return;
  if (bgmOn) bgm.play().catch(() => {}); else bgm.pause();
});

/* ── 雲 ───────────────────────────────────────────────── */
function makeCloud(x) {
  const im = img['cloud' + (1 + Math.floor(Math.random() * 5))];
  const sc = 0.42 + Math.random() * 0.38;
  return {
    im,
    x: x !== undefined ? x : W + Math.random() * 260,
    y: 14 + Math.random() * 150,
    w: im.width * sc, h: im.height * sc,
    sp: 0.20 + Math.random() * 0.16,
  };
}

/* ── 障害物 ───────────────────────────────────────────────
   「絶対に避けられない配置」を作らないため、間隔は時間ではなく距離で決める。
   1回のジャンプで進む距離 D = speed × 滞空時間 を基準に、
   直前と今回の種類の組み合わせごとに必要な間隔を変える。          */
const KINDS = {
  hugu:    { weight: 38 },   // 陸。飛び越える
  hosiLow: { weight: 24 },   // 低い空中。飛び越える
  hosiHi:  { weight: 14 },   // 高い空中。跳ぶと当たるので走って抜ける
  kani:    { weight: 24 },   // 当たっても平気。置き場所の制約なし
};

function pickKind() {
  const entries = Object.entries(KINDS);
  const total = entries.reduce((s, [, k]) => s + k.weight, 0);
  let r = Math.random() * total;
  for (const [name, k] of entries) { r -= k.weight; if (r <= 0) return name; }
  return 'hugu';
}

/* ── どれだけ詰めても避けられるか、ジャンプの軌道から計算する ────────

   ジャンプの高さ:  y(t) = jumpV·t − gravity·t²/2   （0 ≤ t ≤ 滞空時間）

   各障害物には「その高さにいると当たる帯」 [yLow, yHigh] がある。
   当たり判定の箱から逆算して求めるので、絵のサイズを変えても追従する。
     ・フグ / 低い星 … 帯が地面側にある → 上を跳び越せば避けられる
     ・高い星        … 帯が上にあり、頂点(150px)でも越えられない
                       → 跳ばずに走って下を通るしかない
     ・カニ          … 当たっても平気なので帯なし＝どこに置いてもいい

   障害物は「一瞬」ではなく、絵の幅ぶんの時間ずっと当たり判定を持つので、
   その区間のあいだずっと安全でいられるかで判定する。               */

/** 種類ごとの見た目・位置。当たり判定の計算もここを基準にする */
function makeObstacle(kind) {
  let o;
  if (kind === 'hugu') {
    const sc = 0.42;
    o = { kind: kind, im: img.hugu, w: img.hugu.width * sc, h: img.hugu.height * sc, deadly: true };
    o.y = GROUND - o.h;
  } else if (kind === 'hosiLow') {
    const sc = 0.40;
    o = { kind: kind, im: img.hosi, w: img.hosi.width * sc, h: img.hosi.height * sc, deadly: true };
    o.y = GROUND - o.h - 26;
  } else if (kind === 'hosiHi') {
    const sc = 0.40;
    o = { kind: kind, im: img.hosi, w: img.hosi.width * sc, h: img.hosi.height * sc, deadly: true };
    o.y = GROUND - charH() - 30 - o.h;   // 走っていれば頭上を通せる。跳ぶと当たる
  } else {
    const sc = 0.40;
    o = { kind: kind, im: img.kani, w: img.kani.width * sc, h: img.kani.height * sc, deadly: false };
    o.y = GROUND - o.h;
  }
  o.x = W + 40;
  return o;
}

function jumpYAt(t) {
  if (t < 0 || t > AIRTIME) return 0;
  return CFG.jumpV * t - CFG.gravity * t * t / 2;
}

/* 判定の時間刻み。0.02 だと「1回のジャンプで2つ跳び越せる限界(0.762秒)」を
   0.008秒だけ超える配置を見分けられず、詰みを通してしまう。
   刻みを細かくしたうえで、区間の前後に PAD の余裕も持たせる。 */
const DT = 0.01;
const PH = Math.round(AIRTIME / DT);              // ジャンプ位相の段数
const ALL_STATES = () => {
  const a = new Set([-1]);                        // -1 = 地上
  for (let ph = 0; ph <= PH; ph++) a.add(ph);     // 0..PH = ジャンプ中の位相
  return a;
};
const stateY = st => (st === -1 ? 0 : jumpYAt(st * DT));

/** 実際に置かれた障害物の「当たる高さの帯」。当たらないもの（カニ）は null */
function bandOf(o) {
  if (!o.deadly) return null;
  const m = 0.18;                                  // hit() と同じ内側マージン
  const ch = charH();
  // ジャンプ高さ y のときのキャラ判定箱: 上端 GROUND−y−0.9ch / 下端 GROUND−y−0.04ch
  // 重なる条件を y について解くと下の2式になる
  return [GROUND - 0.9 * ch - (o.y + o.h * (1 - m)), GROUND - 0.04 * ch - (o.y + o.h * m)];
}
const collisionBand = kind => bandOf(makeObstacle(kind));
const safeAt = (band, y) => !band || !(y > band[0] && y < band[1]);

/* 障害物の x がどの範囲にあるとキャラと重なるか。
   障害物は「一瞬」ではなく、この幅ぶんの時間ずっと当たり判定を持つ。
   幅は種類ごとに違うので、enter/exit をそれぞれ正確に出す
   （半分ずつの近似で済ませると、幅の違う組み合わせでズレて詰みを通す）。 */
function overlapRange(kind) {
  const o = makeObstacle(kind);
  const cw = img.run_01.width * CFG.charScale;
  const cL = 150 - cw / 2 + cw * 0.22, cR = cL + cw * 0.56;   // charBox と同じ
  const m = 0.18;
  return { enter: cR - o.w * m, exit: cL - o.w * (1 - m) };
}
const overlapSpan = kind => { const r = overlapRange(kind); return r.enter - r.exit; };

/** dt 秒ぶん、取りうる状態を進める（地上なら走り続けるか跳ぶかを選べる） */
function advance(cur, dt) {
  let s2 = cur;
  const steps = Math.max(0, Math.round(dt / DT));
  for (let i = 0; i < steps; i++) {
    const n = new Set();
    for (const st of s2) {
      if (st === -1) { n.add(-1); n.add(0); }
      else if (st >= PH) n.add(-1);
      else n.add(st + 1);
    }
    s2 = n;
  }
  return s2;
}

/** その高さ帯に当たらない状態だけ残す */
function filterSafe(cur, band) {
  const n = new Set();
  for (const st of cur) if (safeAt(band, stateY(st))) n.add(st);
  return n;
}

/** 重なっているあいだ「ずっと」安全でなければならない。
    区間の全ステップで判定しながら状態集合を進める。 */
function passThrough(cur, dtBefore, dur, band) {
  let s2 = filterSafe(advance(cur, dtBefore), band);
  const steps = Math.max(1, Math.round(dur / DT));
  for (let i = 0; i < steps && s2.size; i++) {
    s2 = filterSafe(advance(s2, DT), band);
  }
  return s2;
}

/* ── 障害物を置く ───────────────────────────────────────────
   「絶対に避けられない配置」を出さないために、直前の障害物を抜けた時点で
   取りうる状態(state.reach)を持ち回る。次の障害物を置いたときに
   選択肢が MIN_CHOICES 個以上残るところまで間隔を広げる。
   窓で区切って毎回判定し直すと窓をまたいだ詰みを見逃すが、
   状態集合を引き継げば何個続いても正しく判定できる。            */
/* 障害物を抜けた時点で残る選択肢の数。判定は 0.01 秒刻みなので
   14 なら「ジャンプ開始を 0.14 秒ぶん自由に選べる」ことになる。 */
const MIN_CHOICES = 14;

/** 最低限の間隔(px)。フグ同士は重なってよい（判定の区間がひとつにまとまる） */
function minVisualGap(prev, next) {
  if (prev === 'hugu' && next === 'hugu') return makeObstacle('hugu').w * 0.5;
  const wPrev = prev ? makeObstacle(prev).w : 0;
  return wPrev / 2 + makeObstacle(next).w / 2 + 34;
}

/* 間隔は「直前 → 今回」で決まるが、spawn() が設定する nextGap は
   「今回 → 次」までの距離になる。そこで**次に出す種類を先に決めて**、
   その組み合わせで必要な距離を求める。こうしないと、あるペアのために
   計算した距離が別のペアに適用されてしまう。                       */
/* 重なり区間を前後にこれだけ広げて厳しめに見る。
   人はボットのように最適なタイミングでは跳べないので、
   刻みの誤差ぶんだけでなく操作の余裕としても効かせる。 */
const PAD = 0.10;

/** cur の状態から、距離 gap を空けて種類 kind を置いたときに残る選択肢。
    prevKind が null なら列の先頭あつかい。 */
function tryPlace(cur, gap, prevKind, kind) {
  const r = overlapRange(kind);
  const span = r.enter - r.exit;
  const mv = state.speed;
  // 直前が抜けた位置(x=prev.exit)から、今回が重なり始める位置までの距離。
  // 障害物どうしは gap だけ離れているので、その差を引く
  const prevExit = prevKind ? overlapRange(prevKind).exit : r.enter;
  const b = gap + prevExit - r.enter;
  // b < 0 は、直前が抜けきる前に今回が重なり始めている状態（フグ同士がくっつく等）。
  // その場合は「直前が抜けた時点から今回が抜けるまで」を通しで見る
  const before = Math.max(0, b);
  const dur = b >= 0 ? span : span + b;
  return passThrough(cur, Math.max(0, before / mv - PAD), Math.max(0, dur) / mv + PAD * 2, collisionBand(kind));
}

function spawn() {
  const kind = state.nextKind || pickKind();
  // ここに来た時点で、直前からの距離は前回決めた nextGap になっている。
  // その距離で今回を抜けた状態に更新する
  const passed = tryPlace(state.reach, state.curGap, state.lastKind, kind);
  state.reach = passed.size ? passed : ALL_STATES();
  state.obstacles.push(makeObstacle(kind));

  // 次に出す種類を決め、そこまでに必要な距離を求める
  const nk = pickKind();
  let gap = minVisualGap(kind, nk) + Math.random() * 170;
  for (let i = 0; i < 80; i++) {
    if (tryPlace(state.reach, gap, kind, nk).size >= MIN_CHOICES) break;
    gap += 40;
  }

  state.nextKind = nk;
  state.curGap = gap;
  state.nextGap = gap;
  state.lastKind = kind;
  state.sinceSpawn = 0;
}

/** 検証用。並び全体（先頭は自由に入れる前提）が避けられるか */
function solvable(seq) {
  let cur = ALL_STATES();
  let prevExit = 0;
  for (const e of seq) {
    const before = Math.max(0, e.enter - prevExit);
    cur = passThrough(cur, before, e.exit - e.enter, e.band);
    if (!cur.size) return false;
    prevExit = e.exit;
  }
  return true;
}

const charH = () => img.run_01.height * CFG.charScale;

/* ── 当たり判定は見た目より内側に取る（透明部分で理不尽に死なないように） ── */
function charBox() {
  const w = img.run_01.width * CFG.charScale;
  const h = charH();
  const cx = 150, bottom = GROUND - state.y;
  return { x: cx - w / 2 + w * 0.22, y: bottom - h + h * 0.10, w: w * 0.56, h: h * 0.86 };
}
function hit(a, b) {
  const m = 0.18;
  const bx = b.x + b.w * m, by = b.y + b.h * m, bw = b.w * (1 - m * 2), bh = b.h * (1 - m * 2);
  return a.x < bx + bw && a.x + a.w > bx && a.y < by + bh && a.y + a.h > by;
}

/* ── 操作 ─────────────────────────────────────────────── */
function jump() {
  startBgm();
  if (state.mode === 'ready') { start(); return; }
  if (state.mode === 'over')  { reset(); return; }
  if (state.mode !== 'playing') return;
  if (!state.onGround) {
    // 空中でもう一度押したら急降下してすぐ着地する。
    // 「跳ぶのをやめられる」だけなので、避けられる配置が減ることはない
    if (state.vy < CFG.dropV) state.vy = CFG.dropV;
    return;
  }
  state.vy = -CFG.jumpV;
  state.onGround = false;
  state.frame = 0; state.frameT = 0;
  playJump();
}

function start() {
  state.mode = 'playing';
  startOv.classList.remove('show');
  state.last = performance.now();
}

function reset() {
  Object.assign(state, {
    mode: 'playing', speed: CFG.speed0, dist: 0, score: 0,
    y: 0, vy: 0, onGround: true, frame: 0, frameT: 0,
    obstacles: [], flying: [], reach: ALL_STATES(),
    nextKind: null, curGap: 520, sinceSpawn: 0, nextGap: 520, gameT: 0,
    lastKind: null, deadT: 0, last: performance.now(),
  });
  overOv.classList.remove('show');
  lyricsEl.classList.remove('on');
  regEl.classList.remove('hide');
  sendEl.disabled = false;
  regMsg.textContent = '';
}

function die() {
  state.mode = 'dying';
  state.frame = 0; state.frameT = 0; state.deadT = 0;
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem('dino-best', String(state.best)); } catch (e) {}
  }
}

function showOver() {
  state.mode = 'over';
  overSc.textContent = 'SCORE ' + pad(state.score) + '   BEST ' + pad(state.best);
  overOv.classList.add('show');
  try { nameEl.value = localStorage.getItem('dino-name') || ''; } catch (e) {}
  fetchRanking();
}

const pad = n => String(n).padStart(5, '0');

addEventListener('keydown', e => {
  if (document.activeElement === nameEl) return;   // 名前入力中は操作を拾わない
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault(); jump();
  }
}, { passive: false });

wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('#retry, #reg, .rank-box, #rank-close, #rank-ov')) return;
  jump();
});
retryBtn.addEventListener('click', e => { e.stopPropagation(); reset(); });

/* ── ランキング ───────────────────────────────────────── */
let myEntry = null;

function renderRank(el, list) {
  el.innerHTML = '';
  if (!list || !list.length) {
    el.innerHTML = '<li class="rank-empty">まだ登録がありません</li>';
    return;
  }
  list.slice(0, 10).forEach((e, i) => {
    const li = document.createElement('li');
    if (myEntry && e.name === myEntry.name && e.score === myEntry.score) li.className = 'me';
    const no = document.createElement('span'); no.className = 'rank-no'; no.textContent = String(i + 1).padStart(2, '0');
    const nm = document.createElement('span'); nm.className = 'rank-name'; nm.textContent = e.name;
    const sc = document.createElement('span'); sc.className = 'rank-score'; sc.textContent = pad(e.score);
    const dt = document.createElement('span'); dt.className = 'rank-date'; dt.textContent = e.date || '';
    li.append(no, nm, sc, dt);
    el.appendChild(li);
  });
}

function fetchRanking() {
  const targets = [document.getElementById('rank-list'), document.getElementById('rank-list2')];
  targets.forEach(t => { t.innerHTML = '<li class="rank-empty">読み込み中…</li>'; });
  return fetch(WORKER + '/dino-ranking')
    .then(r => r.json())
    .then(d => { targets.forEach(t => renderRank(t, d.ranking)); })
    .catch(() => { targets.forEach(t => { t.innerHTML = '<li class="rank-empty">ランキングを取得できませんでした</li>'; }); });
}

sendEl.addEventListener('click', () => {
  const name = nameEl.value.trim().slice(0, 15);
  if (!name) { regMsg.textContent = '名前を入力してください'; nameEl.focus(); return; }
  sendEl.disabled = true;
  regMsg.textContent = '送信中…';
  try { localStorage.setItem('dino-name', name); } catch (e) {}
  fetch(WORKER + '/dino-ranking', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, score: state.score }),
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d: d })))
    .then(res => {
      if (!res.ok || res.d.error) throw new Error(res.d.error || '登録に失敗しました');
      myEntry = { name: name, score: state.score };
      regMsg.textContent = res.d.rank ? '登録しました（' + res.d.rank + '位）' : '登録しました';
      regEl.classList.add('hide');
      renderRank(document.getElementById('rank-list'), res.d.ranking);
      renderRank(document.getElementById('rank-list2'), res.d.ranking);
    })
    .catch(err => { regMsg.textContent = err.message; sendEl.disabled = false; });
});
nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendEl.click(); });

document.getElementById('btn-rank').addEventListener('click', () => {
  rankOv.classList.add('show');
  fetchRanking();
});
document.getElementById('rank-close').addEventListener('click', () => rankOv.classList.remove('show'));

const lyricsEl = document.getElementById('lyrics');
let lyricsBuilt = false;

function buildLyrics() {
  if (lyricsBuilt) return;
  lyricsBuilt = true;
  const zones = ['ly-top', 'ly-bottom', 'ly-left', 'ly-right'].map(id => document.getElementById(id));
  // 上下は広いので長い行を、左右は細いので短い行を多めに配る
  const order = LYRICS.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  // 左右は細いので短い語だけ。長い行を入れると盤面の縁で切れて見える
  const shortOnes = order.filter(x => x[0].length <= 7);
  const longOnes  = order.filter(x => x[0].length > 7);
  const put = (z, item) => {
    const el = document.createElement('span');
    el.className = 'ly-' + item[1];
    el.textContent = item[0];
    z.appendChild(el);
  };
  longOnes.forEach((item, i) => put(zones[i % 2], item));            // 上下
  shortOnes.forEach((item, i) => {
    put(zones[i % 4], item);                                          // 全体に散らす
    if (i % 2 === 0) put(zones[2 + (i % 2)], item);                   // 左右は隙間が空くので厚めに
  });
  layoutLyrics();
}

/** 盤面の外側だけに歌詞の領域を置く（盤面の裏には文字を出さない） */
let lyRectKey = '';
function layoutLyrics() {
  const r = wrap.getBoundingClientRect();
  const W2 = innerWidth, H2 = innerHeight;
  const key = [r.left, r.top, r.right, r.bottom, W2, H2].map(Math.round).join(',');
  if (key === lyRectKey) return;
  lyRectKey = key;
  const G = 4;                       // 盤面との隙間。端で1pxかぶるのを防ぐ
  const set = (id, x, y, w2, h2) => {
    const el = document.getElementById(id);
    el.style.left = Math.max(0, x) + 'px';
    el.style.top = Math.max(0, y) + 'px';
    el.style.width = Math.max(0, w2) + 'px';
    el.style.height = Math.max(0, h2) + 'px';
  };
  set('ly-top', 0, 0, W2, r.top - G);
  set('ly-bottom', 0, r.bottom + G, W2, H2 - r.bottom - G);
  set('ly-left', 0, r.top, r.left - G, r.height);
  set('ly-right', r.right + G, r.top, W2 - r.right - G, r.height);

  // 念のため、レイヤー全体を「盤面をくり抜いた形」に切り抜く。
  // 領域の置き方だけに頼ると、画面幅によっては端でわずかにかぶる
  const x1 = Math.max(0, r.left - G), x2 = Math.min(W2, r.right + G);
  const y1 = Math.max(0, r.top - G),  y2 = Math.min(H2, r.bottom + G);
  lyricsEl.style.clipPath =
    `polygon(0px 0px, 0px ${H2}px, ${x1}px ${H2}px, ${x1}px ${y1}px, ${x2}px ${y1}px, ` +
    `${x2}px ${y2}px, ${x1}px ${y2}px, ${x1}px ${H2}px, ${W2}px ${H2}px, ${W2}px 0px)`;
}
addEventListener('resize', layoutLyrics);

function updateLyrics() {
  const on = state.score >= LYRICS_AT && state.mode !== 'ready';
  if (on && !lyricsBuilt) buildLyrics();
  if (on) layoutLyrics();          // 盤面の大きさが変わっても追従させる（変化時のみ再配置）
  lyricsEl.classList.toggle('on', on);
}

/* ── ボット（キーボードで dinobot と打つと切り替え）───────────
   見本用。ゲーム本体と同じ「到達可能な状態」で先を読み、
   待てるうちは待って、待てなくなったら跳ぶ。                  */
const BOT_CODE = 'dinobot';
const MUTEKI_CODE = 'mutekiman';   // デバッグ用。当たっても死ななくなる
let keyBuf = '', botOn = false, muteki = false;

function survivesSeq(start, spans) {
  let cur = start, pe = 0;
  for (const sp of spans) {
    cur = passThrough(cur, Math.max(0, sp.a - pe), sp.b - sp.a, sp.band);
    if (!cur.size) return false;
    pe = Math.max(pe, sp.b);
  }
  return true;
}

function botThink() {
  if (!botOn || state.mode !== 'playing' || !state.onGround) return;
  const mv = state.speed * SPD();
  const cw = img.run_01.width * CFG.charScale;
  const cL = 150 - cw / 2 + cw * 0.22, cR = cL + cw * 0.56;
  const M = 0.18;

  const spans = [];
  for (const o of state.obstacles) {
    if (!o.deadly) continue;
    const a = (o.x - (cR - o.w * M)) / mv;
    const b2 = (o.x - (cL - o.w * (1 - M))) / mv;
    if (b2 < 0 || a > 1.8) continue;            // 遠すぎる先は見ない（負荷対策）
    spans.push({ a: Math.max(0, a), b: b2, band: bandOf(o) });
  }
  if (!spans.length) return;
  spans.sort((x, y) => x.a - y.a);
  spans.length = Math.min(spans.length, 3);

  // 判定は 0.01 秒刻み、画面は 60fps なので、ぎりぎりを狙うと取りこぼす。
  // 少しだけ早めに踏み切る
  const F = 0.035;
  const later = spans.map(sp => ({ a: Math.max(0, sp.a - F), b: sp.b - F, band: sp.band }))
                     .filter(sp => sp.b > 0);
  if (survivesSeq(new Set([-1]), later)) return;   // まだ待てる
  if (survivesSeq(new Set([0]), spans)) jump();    // 待てないので跳ぶ
}

function setBot(on) {
  botOn = on;
  document.getElementById('bot-tag').hidden = !on;
  if (on && state.mode === 'ready') jump();        // 見本なので勝手に始める
}

function setMuteki(on) {
  muteki = on;
  document.getElementById('muteki-tag').hidden = !on;
}

addEventListener('keydown', e => {
  if (document.activeElement === nameEl) return;
  if (!e.key || e.key.length !== 1) return;
  keyBuf = (keyBuf + e.key.toLowerCase()).slice(-Math.max(BOT_CODE.length, MUTEKI_CODE.length));
  if (keyBuf.endsWith(BOT_CODE))    { keyBuf = ''; setBot(!botOn); }
  if (keyBuf.endsWith(MUTEKI_CODE)) { keyBuf = ''; setMuteki(!muteki); }
});

/* ── 更新 ─────────────────────────────────────────────── */
function update(dt) {
  // スタート画面では背景を動かさない
  if (state.mode === 'ready') return;

  if (state.mode === 'dying') {
    state.deadT += dt;
    state.frameT += dt;
    const spf = 1 / CFG.deadFps;
    while (state.frameT >= spf) {
      state.frameT -= spf;
      state.frame = Math.min(DEAD_SEQ.length - 1, state.frame + 1);   // 最後のコマで止める
    }
    if (state.deadT > DEAD_SEQ.length / CFG.deadFps + 0.35) showOver();
    return;
  }
  if (state.mode !== 'playing') return;

  // 1秒あたり +0.5%
  state.gameT += dt;
  state.speed = Math.min(CFG.speedMax, state.speed * Math.pow(CFG.speedRate, dt));
  state.dist += state.speed * dt;
  state.score = Math.floor(state.dist / 12);

  const mv = state.speed * SPD();
  state.bgScroll += mv * dt;
  state.sunX     += mv * 0.06 * dt;
  updateClouds(dt, mv);

  if (!state.onGround) {
    state.vy += CFG.gravity * dt;
    state.y -= state.vy * dt;
    if (state.y <= 0) { state.y = 0; state.vy = 0; state.onGround = true; state.frame = 0; }
  }

  state.frameT += dt;
  const spf = 1 / (state.onGround ? CFG.runFps : CFG.jumpFps);
  while (state.frameT >= spf) {
    state.frameT -= spf;
    if (state.onGround) state.frame = (state.frame + 1) % RUN_SEQ.length;
    else state.frame = Math.min(JUMP_SEQ.length - 1, state.frame + 1);
  }

  // 距離で湧かせる
  state.sinceSpawn += mv * dt;
  if (state.sinceSpawn >= state.nextGap) spawn();

  const box = charBox();
  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const o = state.obstacles[i];
    o.x -= mv * dt;
    if (o.x + o.w < -60) { state.obstacles.splice(i, 1); continue; }
    if (!hit(box, o)) continue;
    if (o.deadly) {
      if (muteki) continue;          // デバッグ用の無敵。すり抜ける
      die(); return;
    }
    // カニ: 弾き飛ばす
    state.obstacles.splice(i, 1);
    state.flying.push({
      im: img.kaniyarare, x: o.x, y: o.y,
      w: img.kaniyarare.width * 0.40, h: img.kaniyarare.height * 0.40,
      vx: 210 + Math.random() * 90, vy: -430 - Math.random() * 110,
      rot: 0, vr: 7 + Math.random() * 4,
    });
    state.score += 25;
    state.dist += 25 * 12;
  }

  for (let i = state.flying.length - 1; i >= 0; i--) {
    const f = state.flying[i];
    f.vy += CFG.gravity * 0.85 * dt;
    f.x += f.vx * SPD() * dt;
    f.y += f.vy * dt;
    f.rot += f.vr * dt;
    if (f.y > H + 200) state.flying.splice(i, 1);
  }
}

function updateClouds(dt, baseSpeed) {
  for (let i = state.clouds.length - 1; i >= 0; i--) {
    const c = state.clouds[i];
    c.x -= baseSpeed * c.sp * dt;
    if (c.x + c.w < -40) state.clouds.splice(i, 1);
  }
  if (state.clouds.length < 5 && Math.random() < dt * 0.85) state.clouds.push(makeCloud());
}

/* ── 描画 ─────────────────────────────────────────────── */
function drawTile(x, mirror) {
  if (!mirror) { ctx.drawImage(img.back, x, 0, TILE, H); return; }
  ctx.save();
  ctx.translate(x + TILE, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(img.back, 0, 0, TILE, H);
  ctx.restore();
}

function draw() {
  // 背景（1枚おきに反転して並べる。back の左右の端は色が揃っておらず、
  // そのまま並べるとつなぎ目が縦線として見えるため）
  const tile = Math.floor(state.bgScroll / TILE);
  const off  = state.bgScroll - tile * TILE;
  const n    = Math.ceil((W + off) / TILE) + 1;
  for (let i = 0; i < n; i++) drawTile(-off + i * TILE, ((tile + i) & 1) === 1);

  // 太陽（いちばん遅い）
  const sw = img.sun.width * 0.62, sh = img.sun.height * 0.62;
  const period = W + sw + 700;
  let sx = W - 180 - (state.sunX % period);
  if (sx + sw < 0) sx += period;
  ctx.globalAlpha = 0.92;
  ctx.drawImage(img.sun, sx, 26, sw, sh);
  ctx.globalAlpha = 1;

  for (const c of state.clouds) ctx.drawImage(c.im, c.x, c.y, c.w, c.h);
  for (const o of state.obstacles) ctx.drawImage(o.im, o.x, o.y, o.w, o.h);

  for (const f of state.flying) {
    ctx.save();
    ctx.translate(f.x + f.w / 2, f.y + f.h / 2);
    ctx.rotate(f.rot);
    ctx.drawImage(f.im, -f.w / 2, -f.h / 2, f.w, f.h);
    ctx.restore();
  }

  // キャラ（コマごとに高さが違うので下端を接地させる）
  let seq, idx;
  if (state.mode === 'dying') { seq = DEAD_SEQ; idx = state.frame; }
  else if (state.mode === 'over') { seq = DEAD_SEQ; idx = DEAD_SEQ.length - 1; }  // dead4 のまま
  else if (state.onGround) { seq = RUN_SEQ;  idx = state.frame % RUN_SEQ.length; }
  else { seq = JUMP_SEQ; idx = Math.min(state.frame, JUMP_SEQ.length - 1); }
  const im = img[seq[idx]];
  const cw = im.width * CFG.charScale, ch = im.height * CFG.charScale;
  ctx.drawImage(im, 150 - cw / 2, GROUND - state.y - ch, cw, ch);

  // スコア（右上）
  ctx.font = '16px "Press Start 2P", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const label = (state.best ? 'HI ' + pad(state.best) + '   ' : '') + pad(state.score);
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(20,40,70,.85)';
  ctx.strokeText(label, W - 18, 16);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, W - 18, 16);
}

function loop(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000) || 0;
  state.last = now;
  botThink();
  update(dt);
  updateLyrics();
  draw();
  requestAnimationFrame(loop);
}

load().then(() => {
  loading.classList.add('hide');
  fit();
  state.reach = ALL_STATES();
  for (let i = 0; i < 4; i++) state.clouds.push(makeCloud(Math.random() * W));
  state.last = performance.now();
  requestAnimationFrame(loop);
});

// テスト用フック（本番動作には影響しない）
window.__dino = {
  state: state, CFG: CFG, KINDS: KINDS, minVisualGap: minVisualGap,
  AIRTIME: AIRTIME, APEX: APEX, solvable: solvable, passThrough: passThrough,
  advance: advance, filterSafe: filterSafe, ALL_STATES: ALL_STATES, MIN_CHOICES: MIN_CHOICES,
  tryPlace: tryPlace,
  collisionBand: collisionBand, overlapSpan: overlapSpan, jumpYAt: jumpYAt,
};
})();
</script>
