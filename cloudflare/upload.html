<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラ画像アップロード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* ── Design tokens (dark-committed: stream-viewer context) ────────────── */
:root {
  --bg:         #0c0e16;
  --surface:    #131828;
  --surface2:   #1a2035;
  --border:     #1e2640;
  --border-hi:  #2d3a5c;
  --accent:     #6b8cff;
  --accent-dim: rgba(107,140,255,.12);
  --accent-glow:rgba(107,140,255,.25);
  --text:       #dde2f4;
  --muted:      #6b7899;
  --success:    #3dd68c;
  --success-dim:rgba(61,214,140,.12);
  --error:      #f97066;
  --error-dim:  rgba(249,112,102,.12);
}

/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 48px;
}

/* ── Card ───────────────────────────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 40px 36px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.hd {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hd-title {
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: var(--text);
  text-wrap: balance;
}
.hd-title span {
  color: var(--accent);
}
.hd-sub {
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.01em;
}

/* ── Drop zone ──────────────────────────────────────────────────────────── */
.drop-zone {
  border: 2px dashed var(--border-hi);
  border-radius: 16px;
  padding: 48px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
  background: transparent;
}
.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.drop-zone:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.drop-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--accent-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
}
.drop-zone:hover .drop-icon,
.drop-zone.dragover .drop-icon {
  transform: translateY(-4px);
}
.drop-icon svg {
  width: 28px;
  height: 28px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.drop-label {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
  text-align: center;
}
.drop-label em {
  font-style: normal;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.drop-hint {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.03em;
}
input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

/* ── Preview ─────────────────────────────────────────────────────────────── */
.preview-wrap {
  display: none;
  gap: 16px;
  align-items: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border-hi);
  border-radius: 14px;
  padding: 16px;
}
.preview-wrap.visible { display: flex; }
.preview-img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--border-hi);
  background: var(--bg);
  flex-shrink: 0;
}
.preview-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.preview-name {
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.preview-size {
  font-size: 13px;
  color: var(--muted);
}
.preview-clear {
  margin-left: auto;
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  line-height: 1;
  font-size: 18px;
  transition: color .15s;
  align-self: flex-start;
}
.preview-clear:hover { color: var(--error); }

/* ── Submit button ───────────────────────────────────────────────────────── */
.btn-upload {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: opacity .15s, transform .1s, box-shadow .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-upload:not(:disabled):hover {
  opacity: .88;
  box-shadow: 0 0 18px var(--accent-glow);
}
.btn-upload:not(:disabled):active { transform: translateY(1px); }
.btn-upload:disabled {
  opacity: .35;
  cursor: not-allowed;
}
.btn-upload.loading svg {
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Status ──────────────────────────────────────────────────────────────── */
.status {
  display: none;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 14px;
  font-weight: 500;
  gap: 10px;
  align-items: flex-start;
}
.status.visible { display: flex; }
.status.ok  { background: var(--success-dim); color: var(--success); border: 1px solid rgba(61,214,140,.25); }
.status.err { background: var(--error-dim);   color: var(--error);   border: 1px solid rgba(249,112,102,.25); }
.status-icon { flex-shrink: 0; font-size: 18px; line-height: 1.3; }
.status-text { line-height: 1.5; }

/* ── Rules section ───────────────────────────────────────────────────────── */
.rules {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}
.rules-title {
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.rules-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  list-style: none;
}
.rules-list li {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rules-list li::before {
  content: '·';
  color: var(--border-hi);
  font-size: 16px;
  line-height: 1;
  flex-shrink: 0;
}

/* ── Footer ──────────────────────────────────────────────────────────────── */
.foot {
  margin-top: 20px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  letter-spacing: .02em;
}

/* ── Reduced motion ──────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .drop-zone, .drop-icon, .btn-upload, .btn-upload.loading svg { transition: none; animation: none; }
}
</style>
</head>
<body>

<div class="card" role="main">
  <header class="hd">
    <h1 class="hd-title">キャラ画像を<span>追加</span>しよう</h1>
    <p class="hd-sub">アップロードした画像は配信画面のゲームに登場します</p>
  </header>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="画像ファイルを選択またはドロップ">
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" aria-hidden="true">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <p class="drop-label">ドラッグ＆ドロップ または <em>クリックして選択</em></p>
    <p class="drop-hint">PNG · JPG · WebP · GIF &nbsp;／&nbsp; 最大 2 MB</p>
  </div>

  <!-- Preview -->
  <div class="preview-wrap" id="previewWrap">
    <img class="preview-img" id="previewImg" src="" alt="プレビュー">
    <div class="preview-info">
      <p class="preview-name" id="previewName"></p>
      <p class="preview-size" id="previewSize"></p>
    </div>
    <button class="preview-clear" id="previewClear" title="選択を解除" aria-label="選択を解除">×</button>
  </div>

  <!-- Status -->
  <div class="status" id="status" role="alert" aria-live="polite">
    <span class="status-icon" id="statusIcon"></span>
    <span class="status-text" id="statusText"></span>
  </div>

  <!-- Upload button -->
  <button class="btn-upload" id="btnUpload" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    アップロード
  </button>

  <div class="rules">
    <p class="rules-title">注意事項</p>
    <ul class="rules-list">
      <li>他の人や実在のキャラの画像は使わないでください</li>
      <li>ファイルは PNG / JPG / WebP / GIF のみ対応です</li>
      <li>2 MB を超えるファイルはアップロードできません</li>
      <li>内容によっては配信者の判断で削除されます</li>
    </ul>
  </div>
</div>

<p class="foot">kukuCome キャラ追加ポータル</p>

<script>
// ← デプロイ後に CloudflareワーカーのURLを入れてください（末尾スラッシュなし）
const WORKER_URL = 'https://kukucome-chara-worker.chikamakoo.workers.dev';

const dropZone   = document.getElementById('dropZone');
const fileInput  = document.getElementById('fileInput');
const previewWrap= document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const previewName= document.getElementById('previewName');
const previewSize= document.getElementById('previewSize');
const previewClear=document.getElementById('previewClear');
const btnUpload  = document.getElementById('btnUpload');
const status     = document.getElementById('status');
const statusIcon = document.getElementById('statusIcon');
const statusText = document.getElementById('statusText');

let selectedFile = null;

// ── Show / hide status ──────────────────────────────────────────────────
function showStatus(type, icon, text) {
  status.className = 'status visible ' + type;
  statusIcon.textContent = icon;
  statusText.textContent = text;
}
function hideStatus() {
  status.className = 'status';
}

// ── Format file size ────────────────────────────────────────────────────
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

// ── Set selected file ───────────────────────────────────────────────────
function setFile(file) {
  if (!file) return;

  const allowed = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
  if (!allowed.includes(file.type)) {
    showStatus('err', '❌', '対応していない形式です。PNG / JPG / WebP / GIF を選んでください。');
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    showStatus('err', '❌', `ファイルが大きすぎます（${fmtSize(file.size)}）。2MB以下にしてください。`);
    return;
  }

  selectedFile = file;
  hideStatus();

  const reader = new FileReader();
  reader.onload = e => { previewImg.src = e.target.result; };
  reader.readAsDataURL(file);

  previewName.textContent = file.name;
  previewSize.textContent = fmtSize(file.size);
  previewWrap.classList.add('visible');
  btnUpload.disabled = false;
}

// ── Clear selection ─────────────────────────────────────────────────────
function clearFile() {
  selectedFile = null;
  fileInput.value = '';
  previewWrap.classList.remove('visible');
  previewImg.src = '';
  btnUpload.disabled = true;
  hideStatus();
}

// ── File input ──────────────────────────────────────────────────────────
fileInput.addEventListener('change', () => {
  clearFile();
  setFile(fileInput.files[0]);
});

// ── Drag & drop ─────────────────────────────────────────────────────────
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  clearFile();
  setFile(e.dataTransfer.files[0]);
});

// keyboard
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});

previewClear.addEventListener('click', clearFile);

// ── Upload ───────────────────────────────────────────────────────────────
btnUpload.addEventListener('click', async () => {
  if (!selectedFile) return;

  if (!WORKER_URL) {
    showStatus('err', '⚙️', '管理者設定エラー: WORKER_URL が設定されていません。');
    return;
  }

  btnUpload.disabled = true;
  btnUpload.classList.add('loading');
  btnUpload.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    アップロード中…`;
  hideStatus();

  try {
    const form = new FormData();
    form.append('file', selectedFile);

    const res = await fetch(WORKER_URL + '/upload', { method: 'POST', body: form });
    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'アップロードに失敗しました');
    }

    showStatus('ok', '✅', 'アップロード完了！配信画面に自動で追加されます。ありがとうございます！');
    clearFile();
  } catch (err) {
    showStatus('err', '❌', err.message || 'ネットワークエラーが発生しました。もう一度お試しください。');
    btnUpload.disabled = false;
  } finally {
    btnUpload.classList.remove('loading');
    btnUpload.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      アップロード`;
  }
});
</script>
</body>
</html>
