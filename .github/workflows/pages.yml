name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - chara/**
      - .nojekyll

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (index.html + chara/)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -r chara _site/chara

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
