<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kukuCome</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c&family=Noto+Sans+JP&family=Reggae+One&family=RocknRoll+One&family=Stick&family=Kaisei+Opti&family=Yuji+Syuku&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
  <!-- ユーザーインストールフォント（OBS Browser Source 対応） -->
  <style id="user-fonts-face">
    @font-face { font-family: "02UtsukushiMincho";               src: url('/user-fonts/02UtsukushiMincho.ttf'); }
    @font-face { font-family: "03SmartFont-Proportional";        src: url('/user-fonts/03SmartFont-P.ttf'); }
    @font-face { font-family: "SmartFont UI";                    src: url('/user-fonts/03SmartFontUI.ttf'); }
    @font-face { font-family: "07ReallyScaryMinchotai";          src: url('/user-fonts/07ReallyScaryMinchotai.ttf'); }
    @font-face { font-family: "07TetsubinGothic";                src: url('/user-fonts/07%E9%89%84%E7%93%B6%E3%82%B4%E3%82%B7%E3%83%83%E3%82%AF.ttf'); }
    @font-face { font-family: "27_kurundeco";                    src: url('/user-fonts/27_kurundeco-Regular.otf'); }
    @font-face { font-family: "851MkPOP";                        src: url('/user-fonts/851MkPOP.ttf'); }
    @font-face { font-family: "Dela Gothic One";                 src: url('/user-fonts/DelaGothicOne-Regular.ttf'); }
    @font-face { font-family: "fontopoBOKU";                     src: url('/user-fonts/fontopoBOKU.otf'); }
    @font-face { font-family: "fontopoKEISEN";                   src: url('/user-fonts/fontopoKEISEN.otf'); }
    @font-face { font-family: "FontopoNIKUKYU";                  src: url('/user-fonts/FontopoNIKUKYU.otf'); }
    @font-face { font-family: "FontopoORIENTAL";                 src: url('/user-fonts/FontopoORIENTAL.otf'); }
    @font-face { font-family: "fontopoSOLID";                    src: url('/user-fonts/fontopoSOLID-Regular.otf'); }
    @font-face { font-family: "Genkaimincho";                    src: url('/user-fonts/genkai-mincho.ttf'); }
    @font-face { font-family: "IPAexGothic";                     src: url('/user-fonts/ipaexg.ttf'); }
    @font-face { font-family: "IPAexMincho";                     src: url('/user-fonts/ipaexm.ttf'); }
    @font-face { font-family: "Isego";                           src: url('/user-fonts/Isego.otf'); }
    @font-face { font-family: "KazukiReiwa";       font-weight: normal; src: url('/user-fonts/KazukiReiwa%20-%20Regular.ttf'); }
    @font-face { font-family: "KazukiReiwa";       font-weight: 300;    src: url('/user-fonts/KazukiReiwa%20-%20Light.ttf'); }
    @font-face { font-family: "KazukiReiwa Light";               src: url('/user-fonts/KazukiReiwa%20-%20Light.ttf'); }
    @font-face { font-family: "Kotonoru Muryou-Shiyou Kw-N Black"; src: url('/user-fonts/Kotonoru-Black-Muryou-Shiyou-Kw-N.otf'); }
    @font-face { font-family: "kurobara gothic black";           src: url('/user-fonts/kurobara-gothic-black.ttf'); }
    @font-face { font-family: "kurobara gothic bold";            src: url('/user-fonts/kurobara-gothic-bold.ttf'); }
    @font-face { font-family: "kurobara gothic heavy";           src: url('/user-fonts/kurobara-gothic-heavy.ttf'); }
    @font-face { font-family: "kurobara gothic thin";            src: url('/user-fonts/kurobara-gothic-thin.ttf'); }
    @font-face { font-family: "MatatakinoMincho";                src: url('/user-fonts/MatatakiMincho.otf'); }
    @font-face { font-family: "MOBO-ExtraLight";                 src: url('/user-fonts/MOBO-ExtraLight.otf'); }
    @font-face { font-family: "omatsuri";                        src: url('/user-fonts/omatsuri-Regular.otf'); }
    @font-face { font-family: "SoukouMincho";                    src: url('/user-fonts/SoukouMincho.ttf'); }
    @font-face { font-family: "ShokakiUtage-FreeVer.";           src: url('/user-fonts/%E3%81%97%E3%82%87%E3%81%8B%E3%81%8D%E3%81%86%E3%81%9F%E3%81%92%EF%BC%88%E7%84%A1%E6%96%99%E7%89%88%EF%BC%89.ttf'); }
    @font-face { font-family: "mitubachi";                       src: url('/user-fonts/%E3%81%BF%E3%81%A4%E3%83%90%E3%83%83%E3%83%81%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88ver1.ttf'); }
    @font-face { font-family: "sushiki";                         src: url('/user-fonts/%E6%95%B0%E5%BC%8F%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88ver1.5.ttf'); }
    @font-face { font-family: "sushiki_kana_UB";                 src: url('/user-fonts/%E6%95%B0%E5%BC%8F%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88%E3%81%8B%E3%81%AA%EF%BC%88%E9%9B%A3%E8%A7%A3%EF%BC%89.ttf'); }
  </style>
  <style>
    .cmdgen-output { background: rgba(125,211,252,0.06); border: 1.5px solid rgba(125,211,252,0.3); border-radius: 10px; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: border-color .15s, background .15s; min-height: 46px; }
    .cmdgen-output:hover { border-color: rgba(125,211,252,.6); background: rgba(125,211,252,.1); }
    .cmdgen-output.copied { border-color: rgba(34,197,94,.6); background: rgba(34,197,94,.08); }
    .cmdgen-text { font-family: 'Cascadia Code','Consolas',monospace; font-size: 13px; color: #7dd3fc; word-break: break-all; flex: 1; }
    .cmdgen-text.empty { color: #64748b; font-style: italic; font-family: inherit; font-size: 12px; }
    .cmdgen-copy-label { font-size: 11px; color: #64748b; white-space: nowrap; flex-shrink: 0; }
    .cmdgen-copied { font-size: 12px; color: #22c55e; text-align: right; height: 16px; margin: 3px 0 10px; transition: opacity .3s; }
    .cmdgen-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .cmdgen-label { font-size: 11px; font-weight: 700; color: #64748b; white-space: nowrap; padding-top: 7px; min-width: 70px; }
    .cmdgen-name-input { background: #161b22; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: #e2e8f0; font-size: 12px; padding: 5px 9px; width: 180px; outline: none; font-family: inherit; }
    .cmdgen-name-input:focus { border-color: rgba(125,211,252,.4); }
    .cmdgen-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .cmdgen-chip { background: #161b22; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer; transition: all .12s; user-select: none; color: #64748b; display: inline-flex; align-items: center; gap: 4px; }
    .cmdgen-chip:hover { border-color: rgba(125,211,252,.4); color: #e2e8f0; }
    .cmdgen-chip.selected { background: rgba(125,211,252,.12); border-color: rgba(125,211,252,.5); color: #7dd3fc; }
    .cmdgen-swatch { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); flex-shrink: 0; }
    .cmdgen-reset { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 6px; color: #f87171; font-size: 11px; padding: 5px 12px; cursor: pointer; margin-top: 4px; }
    .cmdgen-reset:hover { background: rgba(248,113,113,.15); }
    .cmdgen-panel { padding: 4px 0; }
  </style>
</head>
<body>

  <!-- 設定バー -->
  <div id="settings">
    <span class="logo">🎮 kukuCome</span>
    <input id="apikey" type="password" placeholder="APIキー" autocomplete="off" spellcheck="false">
    <input id="hash"   type="text"     placeholder="配信番号（空欄で自動取得）" spellcheck="false">
    <button id="startBtn"  class="btn-start">▶ 開始</button>
    <button id="stopBtn"   class="btn-stop" disabled>■ 停止</button>
    <span id="status" class="status-idle">● 停止中</span>
    <span class="help-link">
      <a href="https://live.erinn.biz/login.php?action=getAPIKey" target="_blank">APIキー取得</a>
    </span>
  </div>
  <!-- ボスアゲルバトル HUD（fixed / ステージキャラより前） -->
  <!-- ボスアゲルバトル 登場演出オーバーレイ -->
  <div id="bossEntranceOverlay" class="hidden">
    <canvas id="bossEntranceRings" style="position:absolute;inset:0;pointer-events:none;width:100%;height:100%"></canvas>
    <div id="bossEntranceScanlines"></div>
    <div id="bossEntranceEdge"></div>
    <div id="bossEntranceContent">
      <div id="bossEntranceWarning">⚠ BOSS BATTLE ⚠</div>
      <div id="bossEntranceName">アゲルちゃん</div>
      <div id="bossEntranceSub">— BATTLE START —</div>
    </div>
    <div id="bossEntranceImgWrap">
      <img id="bossEntranceImg" src="" alt="">
    </div>
  </div>

  <div id="agruBattleCharWrap" class="hidden">
    <div id="agruBattleSpeechBubble"></div>
    <div id="agruBattleLog"></div>
  </div>

  <!-- ステージ -->
  <div id="stage">
    <!-- ボスアゲルバトル背景（stage内：ステージキャラより後ろ） -->
    <div id="agruBattleOverlay" class="hidden">
      <div id="agruBattleOverlayBg"></div>
      <!-- タイマー残時間連動・背景赤黒化オーバーレイ（背景画像のみに適用） -->
      <div id="bossTimerBgDark" style="position:absolute; inset:0; z-index:1; pointer-events:none; background:rgba(80,0,0,0); transition:background 1.5s ease-out;"></div>
    </div>
    <!-- ボスアゲルバトル エフェクトキャンバス（背景レイヤー：ボスより後ろ） -->
    <canvas id="bossEfxBg" class="hidden" style="position:absolute;inset:0;z-index:25;pointer-events:none;width:100%;height:100%"></canvas>
    <!-- ボスキャラ画像（stage内：ステージキャラより後ろ） -->
    <div id="agruBossFigureWrap" class="hidden">
      <div id="agruBattleCharFigure">
        <img id="agruBattleCharImg" src="" alt="アゲルちゃん">
      </div>
    </div>
    <!-- HPゲージ（stage内：z-index で前後切り替え） -->
    <div id="agruBattleHpWrap">
      <canvas id="agruBattleHpCanvas"></canvas>
      <div id="agruBattleTimerText"></div>
    </div>
    <!-- HP数値（バーと独立して位置・サイズ調整可能） -->
    <div id="agruBattleHpNum"></div>
    <!-- ボスアゲルバトル エフェクトキャンバス（前景レイヤー：ボスより前、キャラより後ろ） -->
    <canvas id="bossEfxFg" class="hidden" style="position:absolute;inset:0;z-index:55;pointer-events:none;width:100%;height:100%"></canvas>
    <!-- ドラマチックタイマー（stage内：z-index で前後切り替え） -->
    <div id="bossTimerWrap" class="hidden">
      <div id="bossTimerDigits">0:00</div>
      <div id="bossTimerLabel">TIME REMAINING</div>
    </div>
    <div id="brToastContainer"></div>
    <div id="trashCan" title="ここにドラッグするとキャラが消えます">
      <img src="/img/gomi.png" alt="ゴミ箱">
    </div>
    <div id="bombBtn" title="💣 全員爆破">💣</div>
    <div id="emptyHint">
    </div>
  </div>

  <!-- コメントログ -->
  <div id="commentLog" class="hidden">
    <div class="log-header">💬 コメントログ</div>
    <div id="commentList"></div>
  </div>

  <!-- ノベルモーダル -->
  <div id="novelModal" class="novel-overlay hidden" onclick="if(event.target===this)closeNovelModal()">
    <div class="novel-modal">
      <div class="novel-modal-header">
        <span>📖 ノベル</span>
        <button class="modal-close" onclick="closeNovelModal()">✕</button>
      </div>
      <iframe id="novelFrame" src="about:blank" class="novel-modal-frame" allowtransparency="true"></iframe>
    </div>
  </div>

  <!-- アゲルちゃん会話モーダル -->
  <div id="agruModal" class="agru-overlay hidden">
    <div class="agru-modal">
      <div class="agru-modal-header">
        <span>🌸 星井野アゲル</span>
        <button class="modal-close" onclick="closeAgruModal()">✕</button>
      </div>
      <div class="agru-modal-body">
        <div class="agru-char-area">
          <div class="agru-char-inner">
            <div class="agru-char-frame">
              <div class="agru-char-bg">
                <img id="agruCharImg" class="agru-char-img" src="" alt="アゲルちゃん">
              </div>
            </div>
          </div>
          <div id="agruEmotionLabel" class="agru-emotion-label"></div>
          <div class="agru-params-overlay">
            <div id="agruAffinityDisplay" class="agru-param-row"></div>
            <div id="agruHungerDisplay" class="agru-param-row"></div>
            <div id="agruSleepDisplay" class="agru-param-row"></div>
            <div id="agruLibidoDisplay" class="agru-param-row"></div>
          </div>
          <div class="agru-sns-bar">
            <span class="agru-sns-icon" title="X">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </span>
            <span class="agru-sns-icon" title="YouTube">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
            </span>
            <span class="agru-sns-icon" title="Instagram">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
            </span>
            <span class="agru-sns-icon" title="TikTok">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
            </span>
          </div>
        </div>
        <div class="agru-chat-area">
          <div id="agruChatLog" class="agru-chat-log"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- アゲルちゃん YouTubeモーダル -->
  <div id="agruYtModal" class="agru-yt-modal hidden">
    <div class="agru-yt-modal-header">
      <span id="agruYtTitle">▶ 再生中</span>
      <button class="modal-close" onclick="closeAgruYtModal()">✕</button>
    </div>
    <iframe id="agruYtIframe" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <!-- キャラ画像設定モーダル -->
  <div id="imageModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>🖼 キャラ画像設定</span>
        <div class="modal-header-sub">画像は <code>public/chara/</code> フォルダに入れてください</div>
        <button id="closeModal" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-images-section">
          <div class="modal-section-title">利用可能な画像 <button id="reloadImages" class="btn-reload">↺ 再読込</button></div>
          <div id="imageGrid" class="image-grid"></div>
        </div>
        <div class="modal-chars-section">
          <div class="modal-section-title">キャラ割り当て <button id="batchAssign" class="btn-reload">🖼 未割当のみ一括割り当て</button> <button id="batchAssignAll" class="btn-reload">🔄 全リセット&一括割り当て</button></div>
          <div id="charSlots" class="char-slots"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ニューステッカー（app.js より前に配置） -->
  <div id="newsTicker" class="news-ticker hidden">
    <div id="newsTickerWrap" class="news-ticker-wrap"></div>
  </div>
  <!-- ニューステッカー制御ボタン（adminパネルからのBroadcastChannel経由クリック用） -->
  <div style="display:none">
    <button id="newsTickerModeHBtn"></button>
    <button id="newsTickerModeVBtn"></button>
    <button id="newsTickerModeSBtn"></button>
    <button id="newsTickerModeTBtn"></button>
    <button id="newsTickerTategakiBtn"></button>
  </div>

  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- app.js を機能単位で分割（番号順に読み込むこと＝元の実行順を保持）。
       全ファイル同一グローバルスコープを共有するため、関数・コマンドの動作は単一ファイル時と同一。 -->
  <script src="js/app-01-core-characters.js"></script>
  <script src="js/app-02-effects.js"></script>
  <script src="js/app-03-boss-pets.js"></script>
  <script src="js/app-04-battle-royale.js"></script>
  <script src="js/app-05-taiman-boss.js"></script>
  <script src="js/app-06-comment-handler.js"></script>
  <script src="js/app-07-ui-stage-ai.js"></script>
  <script src="js/app-08-agru-chat.js"></script>
  <script src="js/app-09-agru-battle-fx.js"></script>
  <script src="js/app-10-agru-battle-skills.js"></script>
  <script src="js/app-11-agru-state-sd.js"></script>
  <script src="js/app-12-features-minigames.js"></script>
  <script src="js/app-13-race-admin-misc.js"></script>
  <script src="js/app-14-stream-physics.js"></script>
</body>
</html>
