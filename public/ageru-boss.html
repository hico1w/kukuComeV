<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボスアゲルバトル 設定</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      font-size: 13px;
      padding: 16px;
      min-height: 100vh;
    }

    /* ── ページヘッダー ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1e293b;
    }
    .page-header h1 {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.04em;
    }
    .page-header h1 span { color: #f97316; }

    /* ── 汎用ボタン ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      padding: 6px 14px;
      transition: filter 0.12s, background 0.12s;
    }
    button:active { filter: brightness(0.85); }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #3b82f6; }
    .btn-save-all {
      background: #ea580c;
      color: #fff;
      font-size: 13px;
      padding: 8px 22px;
    }
    .btn-save-all:hover { background: #f97316; }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: #475569; }
    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
    }
    .btn-preview {
      background: #0e7490;
      color: #fff;
    }
    .btn-preview:hover { background: #0891b2; }
    .btn-play {
      background: #15803d;
      color: #fff;
    }
    .btn-play:hover { background: #16a34a; }

    /* ── セクション ── */
    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    /* ── フォームレイアウト ── */
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .field-row:last-child { margin-bottom: 0; }
    .field-label {
      color: #94a3b8;
      white-space: nowrap;
      min-width: 120px;
      font-size: 12px;
    }
    .field-label.narrow { min-width: 80px; }
    .field-hint {
      color: #475569;
      font-size: 10px;
      margin-left: 4px;
    }

    input[type="text"],
    input[type="number"],
    select.sel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #e2e8f0;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select.sel:focus { border-color: #3b82f6; }
    input[type="number"].w60  { width: 60px; }
    input[type="number"].w80  { width: 80px; }
    input[type="number"].w100 { width: 100px; }
    input[type="text"].w-full { flex: 1; }
    select.sel { max-width: 260px; }
    select.sel.w-full { flex: 1; max-width: none; }

    /* ── トグルスイッチ ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #334155;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #64748b;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-track { background: #1d4ed8; }
    .toggle input:checked + .toggle-track::after { transform: translateX(18px); background: #fff; }

    /* ── スキルアコーディオン ── */
    .skill-list { display: flex; flex-direction: column; gap: 8px; }

    .skill-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .skill-card.open { border-color: #475569; }

    .skill-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .skill-header:hover { background: rgba(255,255,255,0.03); }

    .skill-chevron {
      color: #475569;
      font-size: 11px;
      width: 14px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .skill-card.open .skill-chevron { transform: rotate(90deg); color: #94a3b8; }

    .skill-name {
      flex: 1;
      font-weight: 700;
      font-size: 13px;
      color: #e2e8f0;
    }
    .skill-id-badge {
      font-size: 10px;
      color: #475569;
      font-family: monospace;
      background: #1e293b;
      border-radius: 4px;
      padding: 1px 6px;
    }

    .skill-body {
      display: none;
      padding: 14px;
      border-top: 1px solid #1e293b;
      flex-direction: column;
      gap: 14px;
    }
    .skill-card.open .skill-body { display: flex; }

    .skill-subsection-title {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    /* ── 重みグリッド ── */
    .weights-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .weight-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .weight-cell label {
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
    .weight-cell input {
      text-align: center;
      width: 100%;
    }

    /* ── スプライト設定 ── */
    .sprite-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .sprite-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .sprite-cell label {
      font-size: 10px;
      color: #64748b;
    }
    .sprite-cell input { width: 100%; }

    /* スプライト選択UI */
    .sprite-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
    }
    .sprite-picker-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* サウンド選択UI */
    .sound-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .sound-row input[type="text"] { flex: 1; }

    /* スプライトプレビューキャンバス */
    .sprite-preview-wrap {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 4px;
    }
    .sprite-canvas-wrap {
      background: #000;
      border: 1px solid #334155;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    canvas.sprite-prev {
      display: block;
    }

    /* ── ステータスバー ── */
    #statusBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 8px 16px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }
    #statusMsg { flex: 1; }
    #statusMsg.ok  { color: #4ade80; }
    #statusMsg.err { color: #f87171; }
    body { padding-bottom: 52px; }

    /* ── ローディング ── */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #94a3b8;
    }
    .loading-overlay.show { display: flex; }

    /* ── モーダル（スプライト選択） ── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: min(600px, 95vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
    }
    .modal h3 {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
    }
    .image-thumb {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.12s;
      position: relative;
    }
    .image-thumb:hover { border-color: #3b82f6; }
    .image-thumb.selected { border-color: #f97316; }
    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .image-thumb-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      font-size: 9px;
      padding: 2px 3px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* サウンドモーダル */
    .sound-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 350px;
      overflow-y: auto;
    }
    .sound-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .sound-item:hover { background: #0f172a; }
    .sound-item.selected { background: #1d3a5f; }
    .sound-item-path { flex: 1; font-size: 11px; color: #94a3b8; font-family: monospace; }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>

<!-- ローディング -->
<div class="loading-overlay" id="loadingOverlay">読み込み中...</div>

<!-- スプライト選択モーダル -->
<div class="modal-bg" id="spriteModal">
  <div class="modal">
    <h3>スプライト画像を選択</h3>
    <div class="modal-body">
      <div class="field-row" style="gap:8px;">
        <span class="field-label narrow">フォルダ</span>
        <select class="sel w-full" id="spriteFolderSel"></select>
        <button class="btn-secondary btn-sm" onclick="loadSpriteImages()">読み込み</button>
      </div>
      <div class="image-grid" id="spriteImageGrid">
        <div style="color:#475569;font-size:12px;grid-column:1/-1;padding:20px 0;text-align:center;">
          フォルダを選んで「読み込み」を押してください
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSpriteModal()">キャンセル</button>
      <button class="btn-primary" onclick="confirmSpriteSelect()">選択</button>
    </div>
  </div>
</div>

<!-- サウンド選択モーダル -->
<div class="modal-bg" id="soundModal">
  <div class="modal">
    <h3>効果音を選択</h3>
    <div class="modal-body">
      <input type="text" class="w-full" id="soundSearch" placeholder="絞り込み検索..."
        oninput="filterSounds(this.value)" style="flex:none;width:100%;margin-bottom:4px;">
      <div class="sound-list" id="soundList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSoundModal()">キャンセル</button>
      <button class="btn-primary" onclick="confirmSoundSelect()">選択</button>
    </div>
  </div>
</div>

<!-- ページ本体 -->
<div class="page-header">
  <h1>ボス<span>アゲル</span>バトル 設定</h1>
  <button class="btn-save-all" onclick="saveAll()">全体保存</button>
</div>

<!-- 基本設定 -->
<div class="section">
  <div class="section-title">バトル基本設定</div>
  <div class="field-row">
    <span class="field-label">最大HP</span>
    <input type="number" class="w100" id="maxHP" min="1" value="1000">
    <span class="field-hint">ボスの最大HP</span>
  </div>
  <div class="field-row">
    <span class="field-label">制限時間</span>
    <input type="number" class="w100" id="timeLimit" min="1" value="300">
    <span class="field-hint">秒</span>
  </div>
  <div class="field-row">
    <span class="field-label">カウンター間隔</span>
    <input type="number" class="w100" id="counterInterval" min="1" value="60">
    <span class="field-hint">秒（自動攻撃間隔）</span>
  </div>
</div>

<!-- スキル設定 -->
<div class="section">
  <div class="section-title">スキル設定</div>
  <div class="skill-list" id="skillList">
    <!-- JS で生成 -->
  </div>
</div>

<div style="display:flex;justify-content:flex-end;margin-bottom:60px;">
  <button class="btn-save-all" onclick="saveAll()">全体保存</button>
</div>

<!-- ステータスバー -->
<div id="statusBar">
  <span id="statusMsg">設定を読み込み中...</span>
</div>

<script>
// ────────────────────────────────────────────────────────────────────
// スキル定義
// ────────────────────────────────────────────────────────────────────
const SKILL_DEFS = [
  { id: 'normal',       name: '通常攻撃',    defaultWeights: [60,50,40,30] },
  { id: 'focus_fire',   name: '集中砲火',    defaultWeights: [10,15,20,20] },
  { id: 'all_attack',   name: '全体乱打',    defaultWeights: [10,12,15,15] },
  { id: 'instant_kill', name: '即死撃',      defaultWeights: [0, 0, 1, 3]  },
  { id: 'mp_absorb',    name: 'MP吸収',      defaultWeights: [8, 8, 7, 5]  },
  { id: 'all_mp_drain', name: '全体MP吸収',  defaultWeights: [5, 6, 7, 8]  },
  { id: 'petrify',      name: '石化',        defaultWeights: [4, 4, 5, 5]  },
  { id: 'sleep',        name: '眠り',        defaultWeights: [3, 3, 4, 4]  },
  { id: 'charm',        name: '魅了',        defaultWeights: [2, 2, 3, 4]  },
  { id: 'curse',        name: '呪い',        defaultWeights: [3, 3, 4, 4]  },
  { id: 'self_heal',    name: '自己回復',    defaultWeights: [5, 6, 5, 3]  },
  { id: 'berserk',      name: 'バーサーク',  defaultWeights: [0, 1, 3, 5]  },
];
const HP_TIER_LABELS = ['100-75%', '74-50%', '49-25%', '24-0%'];

// ────────────────────────────────────────────────────────────────────
// 状態
// ────────────────────────────────────────────────────────────────────
let config = {};
let allSounds = [];
let allSoundsFull = [];

// スプライトモーダル用
let _spriteTargetSkillId = null;
let _spriteSelectedPath = null;

// サウンドモーダル用
let _soundTargetSkillId = null;
let _soundSelectedPath = null;

// ────────────────────────────────────────────────────────────────────
// ステータス表示
// ────────────────────────────────────────────────────────────────────
function setStatus(msg, type = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = type;
}

// ────────────────────────────────────────────────────────────────────
// スキルカードを生成
// ────────────────────────────────────────────────────────────────────
function buildSkillCards() {
  const list = document.getElementById('skillList');
  list.innerHTML = '';
  for (const def of SKILL_DEFS) {
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.id = `card-${def.id}`;
    card.innerHTML = `
      <div class="skill-header" onclick="toggleCard('${def.id}')">
        <span class="skill-chevron">▶</span>
        <span class="skill-name">${def.name}</span>
        <span class="skill-id-badge">${def.id}</span>
        <label class="toggle" onclick="event.stopPropagation()" title="有効/無効">
          <input type="checkbox" id="enabled-${def.id}" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="skill-body" id="body-${def.id}">

        <!-- 発動確率 -->
        <div>
          <div class="skill-subsection-title">発動確率（HPティア別）</div>
          <div class="weights-grid">
            ${HP_TIER_LABELS.map((lbl, i) => `
              <div class="weight-cell">
                <label>${lbl}</label>
                <input type="number" class="w60" id="w${i}-${def.id}" min="0" max="999" value="0">
              </div>
            `).join('')}
          </div>
        </div>

        <!-- アゲル画像 -->
        <div>
          <div class="skill-subsection-title">アゲル画像</div>
          <div class="field-row">
            <input type="text" class="w-full" id="image-${def.id}"
              placeholder="/ageru/怒り/xxx.png">
          </div>
        </div>

        <!-- スプライトエフェクト -->
        <div>
          <div class="skill-subsection-title">スプライトエフェクト</div>
          <div class="sprite-picker">
            <div class="sprite-picker-row">
              <input type="text" style="flex:1;" id="spritePath-${def.id}"
                placeholder="フォルダ名/ファイル名.png">
              <button class="btn-secondary btn-sm" onclick="openSpriteModal('${def.id}')">Spriteを選ぶ</button>
            </div>
            <div class="sprite-grid">
              <div class="sprite-cell">
                <label>cols（列数）</label>
                <input type="number" id="spriteCols-${def.id}" min="1" value="5">
              </div>
              <div class="sprite-cell">
                <label>rows（行数）</label>
                <input type="number" id="spriteRows-${def.id}" min="1" value="4">
              </div>
              <div class="sprite-cell">
                <label>frameCount</label>
                <input type="number" id="spriteFrameCount-${def.id}" min="1" value="20">
              </div>
              <div class="sprite-cell">
                <label>fps</label>
                <input type="number" id="spriteFps-${def.id}" min="1" value="10">
              </div>
              <div class="sprite-cell">
                <label>size（px）</label>
                <input type="number" id="spriteSize-${def.id}" min="1" value="200">
              </div>
            </div>
            <div class="sprite-preview-wrap">
              <button class="btn-preview btn-sm" onclick="previewSprite('${def.id}')">プレビュー</button>
              <div class="sprite-canvas-wrap" id="spriteCanvasWrap-${def.id}" style="display:none;">
                <canvas class="sprite-prev" id="spriteCanvas-${def.id}" width="200" height="200"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- 効果音 -->
        <div>
          <div class="skill-subsection-title">効果音</div>
          <div class="sound-row">
            <input type="text" id="sound-${def.id}"
              placeholder="sentou/剣で斬る1.mp3">
            <button class="btn-secondary btn-sm" onclick="openSoundModal('${def.id}')">音を選ぶ</button>
            <button class="btn-play btn-sm" onclick="playSound('${def.id}')">▶</button>
          </div>
        </div>

      </div>
    `;
    list.appendChild(card);
  }
}

function toggleCard(skillId) {
  const card = document.getElementById(`card-${skillId}`);
  card.classList.toggle('open');
}

// ────────────────────────────────────────────────────────────────────
// config を DOM に反映
// ────────────────────────────────────────────────────────────────────
function applyConfigToDOM() {
  document.getElementById('maxHP').value = config.maxHP ?? 1000;
  document.getElementById('timeLimit').value = config.timeLimit ?? 300;
  document.getElementById('counterInterval').value = config.counterInterval ?? 60;

  const skills = config.skills || {};
  for (const def of SKILL_DEFS) {
    const sk = skills[def.id] || {};
    const weights = sk.weights || def.defaultWeights;
    const sprite = sk.sprite || {};

    document.getElementById(`enabled-${def.id}`).checked = sk.enabled !== false;

    for (let i = 0; i < 4; i++) {
      document.getElementById(`w${i}-${def.id}`).value = weights[i] ?? 0;
    }

    document.getElementById(`image-${def.id}`).value = sk.image || '';
    document.getElementById(`spritePath-${def.id}`).value = sprite.path || '';
    document.getElementById(`spriteCols-${def.id}`).value = sprite.cols ?? 5;
    document.getElementById(`spriteRows-${def.id}`).value = sprite.rows ?? 4;
    document.getElementById(`spriteFrameCount-${def.id}`).value = sprite.frameCount ?? 20;
    document.getElementById(`spriteFps-${def.id}`).value = sprite.fps ?? 10;
    document.getElementById(`spriteSize-${def.id}`).value = sprite.size ?? 200;
    document.getElementById(`sound-${def.id}`).value = sk.sound || '';
  }
}

// ────────────────────────────────────────────────────────────────────
// DOM から config を収集
// ────────────────────────────────────────────────────────────────────
function collectConfig() {
  const cfg = {
    maxHP:           parseInt(document.getElementById('maxHP').value) || 1000,
    timeLimit:       parseInt(document.getElementById('timeLimit').value) || 300,
    counterInterval: parseInt(document.getElementById('counterInterval').value) || 60,
    skills: {},
  };

  for (const def of SKILL_DEFS) {
    const weights = [];
    for (let i = 0; i < 4; i++) {
      weights.push(parseInt(document.getElementById(`w${i}-${def.id}`).value) || 0);
    }
    cfg.skills[def.id] = {
      enabled: document.getElementById(`enabled-${def.id}`).checked,
      weights,
      image: document.getElementById(`image-${def.id}`).value.trim(),
      sprite: {
        path:       document.getElementById(`spritePath-${def.id}`).value.trim(),
        cols:       parseInt(document.getElementById(`spriteCols-${def.id}`).value) || 5,
        rows:       parseInt(document.getElementById(`spriteRows-${def.id}`).value) || 4,
        frameCount: parseInt(document.getElementById(`spriteFrameCount-${def.id}`).value) || 20,
        fps:        parseInt(document.getElementById(`spriteFps-${def.id}`).value) || 10,
        size:       parseInt(document.getElementById(`spriteSize-${def.id}`).value) || 200,
      },
      sound: document.getElementById(`sound-${def.id}`).value.trim(),
    };
  }
  return cfg;
}

// ────────────────────────────────────────────────────────────────────
// 読み込み / 保存
// ────────────────────────────────────────────────────────────────────
async function loadConfig() {
  setStatus('設定を読み込み中...');
  try {
    const r = await fetch('/api/boss-ageru-config');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    config = await r.json();
    applyConfigToDOM();
    setStatus('設定を読み込みました', 'ok');
  } catch (e) {
    setStatus('設定の読み込みに失敗しました: ' + e.message, 'err');
  }
}

async function saveAll() {
  const cfg = collectConfig();
  setStatus('保存中...');
  try {
    const r = await fetch('/api/boss-ageru-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    config = cfg;
    setStatus('保存しました', 'ok');
    setTimeout(() => setStatus(''), 3000);
  } catch (e) {
    setStatus('保存に失敗しました: ' + e.message, 'err');
  }
}

// ────────────────────────────────────────────────────────────────────
// スプライトプレビュー
// ────────────────────────────────────────────────────────────────────
function previewSprite(skillId) {
  const path = document.getElementById(`spritePath-${skillId}`).value.trim();
  if (!path) { alert('スプライトパスが入力されていません'); return; }
  const cols = parseInt(document.getElementById(`spriteCols-${skillId}`).value) || 5;
  const rows = parseInt(document.getElementById(`spriteRows-${skillId}`).value) || 4;
  const size = parseInt(document.getElementById(`spriteSize-${skillId}`).value) || 200;

  const canvas = document.getElementById(`spriteCanvas-${skillId}`);
  const wrap = document.getElementById(`spriteCanvasWrap-${skillId}`);
  canvas.width = size;
  canvas.height = size;
  wrap.style.display = 'block';

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);

  const img = new Image();
  img.onload = () => {
    const fw = img.naturalWidth / cols;
    const fh = img.naturalHeight / rows;
    ctx.drawImage(img, 0, 0, fw, fh, 0, 0, size, size);
  };
  img.onerror = () => {
    ctx.fillStyle = '#ef4444';
    ctx.font = '12px sans-serif';
    ctx.fillText('画像の読み込みに失敗', 4, size / 2);
  };
  // スプライト画像は /sprites/ 経由で配信されていると想定
  img.src = '/sprites/' + encodeURIComponent(path).replace(/%2F/g, '/');
}

// ────────────────────────────────────────────────────────────────────
// 効果音再生
// ────────────────────────────────────────────────────────────────────
let _currentAudio = null;
function playSound(skillId) {
  const path = document.getElementById(`sound-${skillId}`).value.trim();
  if (!path) { alert('効果音パスが入力されていません'); return; }
  if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
  const a = new Audio('/sounds/' + path);
  _currentAudio = a;
  a.play().catch(e => alert('再生に失敗しました: ' + e.message));
  a.onended = () => { if (_currentAudio === a) _currentAudio = null; };
}

// ────────────────────────────────────────────────────────────────────
// スプライト選択モーダル
// ────────────────────────────────────────────────────────────────────
async function openSpriteModal(skillId) {
  _spriteTargetSkillId = skillId;
  _spriteSelectedPath = document.getElementById(`spritePath-${skillId}`).value.trim() || null;

  document.getElementById('spriteModal').classList.add('open');

  const folderSel = document.getElementById('spriteFolderSel');
  if (folderSel.options.length === 0) {
    folderSel.innerHTML = '<option value="">-- フォルダ読み込み中 --</option>';
    try {
      const r = await fetch('/api/sprite-folders');
      const d = await r.json();
      const folders = d.folders || [];
      folderSel.innerHTML = '<option value="">-- フォルダを選択 --</option>';
      for (const f of folders) {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        folderSel.appendChild(opt);
      }
    } catch {
      folderSel.innerHTML = '<option value="">読み込み失敗</option>';
    }
  }

  // すでにパスが入っている場合、フォルダを推定して自動選択
  if (_spriteSelectedPath) {
    const parts = _spriteSelectedPath.split('/');
    if (parts.length >= 2) {
      const guessFolder = parts.slice(0, parts.length - 1).join('/');
      for (const opt of folderSel.options) {
        if (opt.value === guessFolder) { opt.selected = true; break; }
      }
    }
  }

  document.getElementById('spriteImageGrid').innerHTML =
    '<div style="color:#475569;font-size:12px;grid-column:1/-1;padding:20px 0;text-align:center;">フォルダを選んで「読み込み」を押してください</div>';
}

async function loadSpriteImages() {
  const folder = document.getElementById('spriteFolderSel').value;
  if (!folder) { return; }
  const grid = document.getElementById('spriteImageGrid');
  grid.innerHTML = '<div style="color:#475569;font-size:12px;grid-column:1/-1;padding:20px 0;text-align:center;">読み込み中...</div>';
  try {
    const r = await fetch('/api/sprite-list/' + encodeURIComponent(folder));
    const d = await r.json();
    const images = d.images || [];
    if (!images.length) {
      grid.innerHTML = '<div style="color:#475569;font-size:12px;grid-column:1/-1;padding:20px 0;text-align:center;">画像が見つかりません</div>';
      return;
    }
    grid.innerHTML = '';
    for (const imgPath of images) {
      const thumb = document.createElement('div');
      thumb.className = 'image-thumb';
      const fullPath = folder + '/' + imgPath;
      if (_spriteSelectedPath === fullPath) thumb.classList.add('selected');
      thumb.dataset.path = fullPath;

      const img = document.createElement('img');
      img.src = '/sprites/' + encodeURIComponent(folder).replace(/%2F/g, '/') + '/' + encodeURIComponent(imgPath);
      img.alt = imgPath;
      img.loading = 'lazy';

      const label = document.createElement('div');
      label.className = 'image-thumb-label';
      label.textContent = imgPath;

      thumb.appendChild(img);
      thumb.appendChild(label);
      thumb.addEventListener('click', () => {
        grid.querySelectorAll('.image-thumb').forEach(t => t.classList.remove('selected'));
        thumb.classList.add('selected');
        _spriteSelectedPath = fullPath;
      });
      grid.appendChild(thumb);
    }
  } catch {
    grid.innerHTML = '<div style="color:#ef4444;font-size:12px;grid-column:1/-1;padding:20px 0;text-align:center;">読み込みエラー</div>';
  }
}

function confirmSpriteSelect() {
  if (!_spriteSelectedPath) { closeSpriteModal(); return; }
  if (_spriteTargetSkillId) {
    document.getElementById(`spritePath-${_spriteTargetSkillId}`).value = _spriteSelectedPath;
  }
  closeSpriteModal();
}

function closeSpriteModal() {
  document.getElementById('spriteModal').classList.remove('open');
  _spriteTargetSkillId = null;
  _spriteSelectedPath = null;
}

// ────────────────────────────────────────────────────────────────────
// サウンド選択モーダル
// ────────────────────────────────────────────────────────────────────
async function openSoundModal(skillId) {
  _soundTargetSkillId = skillId;
  _soundSelectedPath = document.getElementById(`sound-${skillId}`).value.trim() || null;

  document.getElementById('soundSearch').value = '';
  document.getElementById('soundModal').classList.add('open');

  if (!allSoundsFull.length) {
    document.getElementById('soundList').innerHTML =
      '<div style="color:#475569;font-size:12px;padding:16px 0;text-align:center;">読み込み中...</div>';
    try {
      const r = await fetch('/api/sounds');
      const d = await r.json();
      allSoundsFull = d.sounds || [];
    } catch {
      allSoundsFull = [];
    }
  }

  renderSoundList(allSoundsFull);
}

function renderSoundList(sounds) {
  const list = document.getElementById('soundList');
  list.innerHTML = '';
  if (!sounds.length) {
    list.innerHTML = '<div style="color:#475569;font-size:12px;padding:16px 0;text-align:center;">効果音が見つかりません</div>';
    return;
  }
  for (const s of sounds) {
    const item = document.createElement('div');
    item.className = 'sound-item';
    if (_soundSelectedPath === s) item.classList.add('selected');
    item.dataset.path = s;

    const pathEl = document.createElement('span');
    pathEl.className = 'sound-item-path';
    pathEl.textContent = s;

    const playBtn = document.createElement('button');
    playBtn.className = 'btn-play btn-sm';
    playBtn.textContent = '▶';
    playBtn.onclick = (e) => {
      e.stopPropagation();
      if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
      const a = new Audio('/sounds/' + s);
      _currentAudio = a;
      a.play().catch(() => {});
      a.onended = () => { if (_currentAudio === a) _currentAudio = null; };
    };

    item.addEventListener('click', () => {
      list.querySelectorAll('.sound-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      _soundSelectedPath = s;
    });

    item.appendChild(pathEl);
    item.appendChild(playBtn);
    list.appendChild(item);
  }
}

function filterSounds(query) {
  const q = query.toLowerCase();
  const filtered = q ? allSoundsFull.filter(s => s.toLowerCase().includes(q)) : allSoundsFull;
  renderSoundList(filtered);
}

function confirmSoundSelect() {
  if (!_soundSelectedPath) { closeSoundModal(); return; }
  if (_soundTargetSkillId) {
    document.getElementById(`sound-${_soundTargetSkillId}`).value = _soundSelectedPath;
  }
  closeSoundModal();
}

function closeSoundModal() {
  document.getElementById('soundModal').classList.remove('open');
  _soundTargetSkillId = null;
  _soundSelectedPath = null;
}

// モーダル外クリックで閉じる
document.getElementById('spriteModal').addEventListener('click', e => {
  if (e.target === document.getElementById('spriteModal')) closeSpriteModal();
});
document.getElementById('soundModal').addEventListener('click', e => {
  if (e.target === document.getElementById('soundModal')) closeSoundModal();
});

// ────────────────────────────────────────────────────────────────────
// 初期化
// ────────────────────────────────────────────────────────────────────
(async function init() {
  buildSkillCards();
  await loadConfig();
})();
</script>
